<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여행 시작</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Noto Serif KR", "Malgun Gothic", serif;
      background:
        radial-gradient(circle at 15% 10%, #d8ecff 0%, rgba(216, 236, 255, 0) 42%),
        radial-gradient(circle at 85% 15%, #c7e2ff 0%, rgba(199, 226, 255, 0) 44%),
        linear-gradient(180deg, #eef7ff 0%, #dceeff 100%);
      color: #153454;
    }

    .hero {
      width: min(980px, calc(100% - 32px));
      padding: 38px 28px;
      border-radius: 20px;
      border: 1px solid #bcd8f5;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 16px 34px rgba(33, 88, 146, 0.16);
      backdrop-filter: blur(3px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      color: #0f4f8a;
    }

    p {
      margin: 10px 0 0;
      font-size: 16px;
      color: #2f628e;
    }

    .actions {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 16px;
      width: min(100%, 460px);
      margin-left: auto;
      margin-right: auto;
    }

    .action-btn {
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      border-radius: 16px;
      width: 220px;
      aspect-ratio: 1 / 1;
      padding: 14px;
      font-size: 22px;
      font-weight: 700;
      color: #1f5fb5;
      background: transparent;
      border: 2px solid #2f78d8;
      box-shadow: none;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }

    .action-btn .emoji {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #1f5fb5;
    }

    .action-btn .emoji svg {
      width: 40px;
      height: 40px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .action-btn .label {
      font-size: 22px;
      line-height: 1.3;
      word-break: keep-all;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      border-color: #1f5fb5;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 30px;
      }

      .actions {
        grid-template-columns: 1fr;
        width: min(100%, 280px);
      }

      .action-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <h1>Travel Planner</h1>
    <p>원하는 화면을 선택해서 시작하세요.</p>

    <div class="actions">
      <a class="action-btn" href="/itinerary">
        <span class="emoji" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false">
            <path d="M8 2v4" />
            <path d="M16 2v4" />
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M3 10h18" />
            <path d="M8 14h.01" />
            <path d="M12 14h.01" />
            <path d="M16 14h.01" />
            <path d="M8 18h.01" />
            <path d="M12 18h.01" />
            <path d="M16 18h.01" />
          </svg>
        </span>
        <span class="label">나의 여행 일정</span>
      </a>
      <a class="action-btn" href="/mobile-itinerary">
        <span class="emoji" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false">
            <rect x="7" y="2" width="10" height="20" rx="2" />
            <path d="M10 5h4" />
            <circle cx="12" cy="18" r="1" />
          </svg>
        </span>
        <span class="label">모바일 여행일정</span>
      </a>
      <a class="action-btn" href="/trip-feed">
        <span class="emoji" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false">
            <path d="M12 22s7-5.5 7-12a7 7 0 1 0-14 0c0 6.5 7 12 7 12z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>
        </span>
        <span class="label">여행 정보 쌓기</span>
      </a>
      <a class="action-btn" href="/ai-trip">
        <span class="emoji" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false">
            <path d="M12 3v18" />
            <path d="M3 12h18" />
            <circle cx="12" cy="12" r="8" />
          </svg>
        </span>
        <span class="label">AI로 여행만들기</span>
      </a>
    </div>
  </main>
</body>
</html>
