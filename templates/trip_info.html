<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여행 정보</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Serif KR", "Malgun Gothic", serif;
      background:
        radial-gradient(circle at 10% 0%, #d8ecff 0%, rgba(216, 236, 255, 0) 40%),
        radial-gradient(circle at 90% 0%, #c6e1ff 0%, rgba(198, 225, 255, 0) 42%),
        linear-gradient(180deg, #eef7ff 0%, #dfefff 100%);
      color: #153454;
    }
    .wrap {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #bcd8f5;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 14px 30px rgba(33, 88, 146, 0.14);
      backdrop-filter: blur(3px);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #0f4f8a;
    }
    p {
      margin: 0;
      color: #2f628e;
    }
    .desc {
      margin-top: 6px;
      font-size: 14px;
    }
    .page-link-row {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
    }
    .page-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: 700;
      color: #1f5fb5;
      background: #e9f2ff;
      border: 1px solid #bcd8f5;
    }
    .page-link:hover {
      background: #dfeeff;
    }
    .combo-grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .form-grid {
      margin-top: 12px;
      display: grid;
      gap: 12px;
    }
    .option-add-row {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: end;
    }
    .maps-row {
      margin-top: 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
    }
    .coord-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .top-field-grid {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 12px;
      align-items: end;
    }
    .attraction-actions {
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .attraction-input-wrap {
      flex: 1;
      max-width: 520px;
    }
    .mini-btn {
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 700;
    }
    .google-result-wrap {
      border: 1px solid #cfe1f4;
      border-radius: 12px;
      background: #fafdff;
      overflow: hidden;
    }
    .google-result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #edf5ff;
      border-bottom: 1px solid #cfe1f4;
      color: #205689;
      font-weight: 700;
    }
    .google-result-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-bottom: 1px solid #e3eefb;
      background: #f7fbff;
    }
    .google-result-body {
      max-height: 220px;
      overflow: auto;
    }
    .google-col-check {
      width: 78px;
    }
    .google-col-name {
      width: 210px;
    }
    .google-col-type {
      width: 150px;
    }
    .google-col-map {
      width: 90px;
    }
    .select-cell {
      text-align: center;
    }
    .map-link {
      color: #1f5fb5;
      font-weight: 700;
      text-decoration: none;
    }
    .map-link:hover {
      text-decoration: underline;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      color: #1e5284;
    }
    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid #bcd8f5;
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 15px;
      background: #f7fbff;
      color: #1f4e7f;
      font-family: inherit;
    }
    textarea {
      min-height: 92px;
      resize: vertical;
    }
    .action-row {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .action-left,
    .action-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #2f78d8 0%, #1f5fb5 100%);
      box-shadow: 0 10px 20px rgba(31, 95, 181, 0.26);
      cursor: pointer;
    }
    button.secondary {
      color: #1f5fb5;
      background: #e9f2ff;
      border: 1px solid #bcd8f5;
      box-shadow: none;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid #cfe1f4;
      border-radius: 10px;
      background: #f7fbff;
      color: #2f628e;
      font-size: 14px;
    }
    .list-wrap {
      margin-top: 16px;
      border: 1px solid #cfe1f4;
      border-radius: 12px;
      background: #fafdff;
      overflow: hidden;
    }
    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #edf5ff;
      border-bottom: 1px solid #cfe1f4;
      color: #205689;
      font-weight: 700;
    }
    .list-body {
      max-height: 260px;
      overflow: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      table-layout: fixed;
    }
    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid #e3eefb;
      text-align: left;
      color: #244f77;
      vertical-align: top;
    }
    th {
      position: sticky;
      top: 0;
      background: #f5f9ff;
      color: #1f5a95;
      z-index: 1;
    }
    .col-id {
      width: 60px;
    }
    .col-country,
    .col-city {
      width: 90px;
    }
    .col-attraction {
      width: 190px;
    }
    .col-category {
      width: 90px;
    }
    .col-address {
      width: 260px;
    }
    .col-lat,
    .col-lng {
      width: 120px;
    }
    .col-image {
      width: 170px;
    }
    .col-detail {
      width: 220px;
    }
    td.col-country,
    td.col-city,
    td.col-attraction,
    td.col-category,
    td.col-lat,
    td.col-lng {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: keep-all;
    }
    td.col-address {
      word-break: keep-all;
      line-height: 1.35;
    }
    td.col-image {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    td.col-detail {
      word-break: keep-all;
      line-height: 1.4;
    }
    tr.editing-row td {
      background: #e8f3ff;
    }
    .empty-row {
      text-align: center;
      color: #567fa5;
      padding: 18px 10px;
    }
    .image-preview-wrap {
      margin-top: 8px;
      border: 1px dashed #bcd8f5;
      border-radius: 10px;
      background: #f9fcff;
      padding: 8px;
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5a7ea1;
      font-size: 13px;
    }
    .image-preview-wrap img {
      max-width: 100%;
      max-height: 160px;
      border-radius: 8px;
      object-fit: contain;
    }
    .list-thumb {
      width: 54px;
      height: 40px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #cfe1f4;
      background: #fff;
      vertical-align: middle;
      margin-right: 6px;
    }
    @media (max-width: 700px) {
      .combo-grid {
        grid-template-columns: 1fr;
      }
      .action-row {
        flex-direction: column;
        align-items: stretch;
      }
      .action-left,
      .action-right {
        justify-content: flex-end;
      }
      .maps-row,
      .coord-grid,
      .top-field-grid,
      .option-add-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>여행 정보</h1>
      <p class="desc">LocationInfo 테이블에 데이터를 저장합니다.</p>
      <div class="page-link-row">
        <a class="page-link" href="/trip-feed">인스타 피드 보기</a>
      </div>

      <form id="locationInfoForm">
        <div class="combo-grid">
          <div>
            <label for="tripInfoCountry">국가 선택</label>
            <select id="tripInfoCountry" required>
              <option value="">국가를 선택하세요</option>
            </select>
          </div>
          <div>
            <label for="tripInfoCity">도시 선택</label>
            <select id="tripInfoCity" required>
              <option value="">도시를 선택하세요</option>
            </select>
          </div>
        </div>

        <div class="option-add-row">
          <div>
            <label for="tripInfoNewCountry">국가 추가</label>
            <input id="tripInfoNewCountry" placeholder="예: 스페인" />
          </div>
          <div>
            <label for="tripInfoNewCity">도시 추가</label>
            <input id="tripInfoNewCity" placeholder="예: 바르셀로나" />
          </div>
          <button id="addCountryCityBtn" class="secondary" type="button">국가/도시 추가</button>
        </div>

        <div class="list-wrap">
          <div class="list-head">
            <span>등록된 리스트</span>
            <span id="listSummary">0건</span>
          </div>
          <div class="list-body">
            <table>
              <thead>
                <tr>
                  <th class="col-id">ID</th>
                  <th class="col-country">국가</th>
                  <th class="col-city">도시</th>
                  <th class="col-attraction">관광지명</th>
                  <th class="col-category">구분</th>
                  <th class="col-address">주소</th>
                  <th class="col-lat">위도</th>
                  <th class="col-lng">경도</th>
                  <th class="col-image">이미지</th>
                  <th class="col-detail">상세 설명</th>
                </tr>
              </thead>
              <tbody id="tripInfoListBody">
                <tr><td class="empty-row" colspan="10">리스트를 불러오는 중...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="form-grid">
          <div class="maps-row">
            <div>
              <label for="tripInfoMapsUrl">구글맵스 링크</label>
              <input id="tripInfoMapsUrl" placeholder="https://maps.google.com/..." />
            </div>
            <button id="parseMapsBtn" class="secondary" type="button">링크 파싱</button>
          </div>

          <div class="top-field-grid">
            <div>
              <label for="tripInfoCategory">구분</label>
              <select id="tripInfoCategory">
                <option value="">구분 선택</option>
                <option value="랜드마크">랜드마크</option>
                <option value="관광지">관광지</option>
                <option value="맛집">맛집</option>
                <option value="카페">카페</option>
                <option value="숙소">숙소</option>
                <option value="쇼핑">쇼핑</option>
                <option value="기타">기타</option>
              </select>
            </div>
            <div>
              <label for="tripInfoAttraction">관광지명 (Attraction)</label>
              <div class="attraction-actions">
                <div class="attraction-input-wrap">
                  <input id="tripInfoAttraction" required placeholder="예: 콜로세움" />
                </div>
                <button id="fillFromGoogleBtn" class="secondary mini-btn" type="button">Google 검색</button>
              </div>
            </div>
          </div>

          <div class="google-result-wrap">
            <div class="google-result-head">
              <span>Google 검색 결과</span>
              <span id="googleResultSummary">0건</span>
            </div>
            <div class="google-result-actions">
              <button id="selectAllGoogleBtn" class="secondary mini-btn" type="button">전체 선택</button>
              <button id="clearGoogleSelectionBtn" class="secondary mini-btn" type="button">선택 해제</button>
            </div>
            <div class="google-result-body">
              <table>
                <thead>
                  <tr>
                    <th class="google-col-check">선택</th>
                    <th class="google-col-name">장소명</th>
                    <th>주소</th>
                    <th class="google-col-type">타입</th>
                    <th class="google-col-map">지도</th>
                  </tr>
                </thead>
                <tbody id="googleResultBody">
                  <tr><td class="empty-row" colspan="5">관광지명을 입력하고 Google 검색을 눌러주세요.</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="coord-grid">
            <div>
              <label for="tripInfoLatitude">위도</label>
              <input id="tripInfoLatitude" placeholder="예: 25.0339" />
            </div>
            <div>
              <label for="tripInfoLongitude">경도</label>
              <input id="tripInfoLongitude" placeholder="예: 121.5645" />
            </div>
          </div>

          <input id="tripInfoAddress" type="hidden" />

          <div>
            <label for="tripInfoDetail">상세 설명 (Detail)</label>
            <textarea id="tripInfoDetail" placeholder="예: 고대 로마의 대표 원형 경기장"></textarea>
          </div>
          <div>
            <label for="tripInfoImageUrl">이미지 경로 (ImageUrl)</label>
            <input id="tripInfoImageUrl" placeholder="예: /static/db_images/130.svg" spellcheck="false" />
            <div id="tripInfoImagePreview" class="image-preview-wrap">이미지 경로를 입력하면 미리보기가 표시됩니다.</div>
          </div>
        </div>

        <div class="action-row">
          <div class="action-left">
            <button id="refreshListBtn" class="secondary" type="button">등록 리스트 새로고침</button>
            <button id="cancelEditBtn" class="secondary" type="button" style="display: none;">수정 취소</button>
          </div>
          <div class="action-right">
            <button id="saveLocationInfoBtn" type="submit">리스트에 추가</button>
          </div>
        </div>
      </form>

      <div id="tripInfoStatus" class="status">콤보 데이터를 불러오는 중...</div>
    </section>
  </main>

  <script>
    const formEl = document.getElementById('locationInfoForm');
    const countrySelect = document.getElementById('tripInfoCountry');
    const citySelect = document.getElementById('tripInfoCity');
    const mapsUrlInput = document.getElementById('tripInfoMapsUrl');
    const parseMapsBtn = document.getElementById('parseMapsBtn');
    const addressInput = document.getElementById('tripInfoAddress');
    const latitudeInput = document.getElementById('tripInfoLatitude');
    const longitudeInput = document.getElementById('tripInfoLongitude');
    const categoryInput = document.getElementById('tripInfoCategory');
    const attractionInput = document.getElementById('tripInfoAttraction');
    const detailInput = document.getElementById('tripInfoDetail');
    const imageUrlInput = document.getElementById('tripInfoImageUrl');
    const imagePreviewEl = document.getElementById('tripInfoImagePreview');
    const statusEl = document.getElementById('tripInfoStatus');
    const saveBtn = document.getElementById('saveLocationInfoBtn');
    const fillFromGoogleBtn = document.getElementById('fillFromGoogleBtn');
    const selectAllGoogleBtn = document.getElementById('selectAllGoogleBtn');
    const clearGoogleSelectionBtn = document.getElementById('clearGoogleSelectionBtn');
    const googleResultBodyEl = document.getElementById('googleResultBody');
    const googleResultSummaryEl = document.getElementById('googleResultSummary');
    const refreshListBtn = document.getElementById('refreshListBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const listBodyEl = document.getElementById('tripInfoListBody');
    const listSummaryEl = document.getElementById('listSummary');
    const newCountryInput = document.getElementById('tripInfoNewCountry');
    const newCityInput = document.getElementById('tripInfoNewCity');
    const addCountryCityBtn = document.getElementById('addCountryCityBtn');

    let cityOptions = {};
    let currentItems = [];
    let editingId = null;
    let googleCandidates = [];
    const selectedGoogleIndexes = new Set();

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function clearFormOnly() {
      mapsUrlInput.value = '';
      addressInput.value = '';
      latitudeInput.value = '';
      longitudeInput.value = '';
      categoryInput.value = '';
      attractionInput.value = '';
      detailInput.value = '';
      imageUrlInput.value = '';
      updateImagePreview();
    }

    function setGoogleActionButtonsDisabled(disabled) {
      fillFromGoogleBtn.disabled = disabled;
      selectAllGoogleBtn.disabled = disabled;
      clearGoogleSelectionBtn.disabled = disabled;
    }

    function renderGoogleResults() {
      if (!Array.isArray(googleCandidates) || googleCandidates.length === 0) {
        googleResultBodyEl.innerHTML = '<tr><td class="empty-row" colspan="5">검색 결과가 없습니다.</td></tr>';
        googleResultSummaryEl.textContent = '0건';
        return;
      }

      const rows = googleCandidates.map((place, index) => {
        const isChecked = selectedGoogleIndexes.has(index) ? 'checked' : '';
        const name = escapeHtml(place.displayName || '이름 없음');
        const address = escapeHtml(place.formattedAddress || '-');
        const type = escapeHtml(Array.isArray(place.types) ? (place.types[0] || '-') : '-');
        const mapLink = place.googleMapsUri
          ? `<a class="map-link" href="${escapeHtml(place.googleMapsUri)}" target="_blank" rel="noopener">열기</a>`
          : '-';

        return `
          <tr>
            <td class="select-cell"><input type="checkbox" data-google-index="${index}" ${isChecked} /></td>
            <td>${name}</td>
            <td>${address}</td>
            <td>${type}</td>
            <td>${mapLink}</td>
          </tr>
        `;
      });

      googleResultBodyEl.innerHTML = rows.join('');
      googleResultSummaryEl.textContent = `${googleCandidates.length}건`;
    }

    function getSelectedGoogleCandidates() {
      return Array.from(selectedGoogleIndexes)
        .map((idx) => googleCandidates[idx])
        .filter(Boolean);
    }

    function applyGoogleCandidateToForm(place) {
      if (!place || typeof place !== 'object') {
        return;
      }

      if (place.displayName) {
        attractionInput.value = String(place.displayName).trim();
      }
      if (place.googleMapsUri) {
        mapsUrlInput.value = String(place.googleMapsUri);
      }
      if (place.formattedAddress) {
        addressInput.value = String(place.formattedAddress);
      }
      latitudeInput.value = place.latitude == null ? '' : String(place.latitude);
      longitudeInput.value = place.longitude == null ? '' : String(place.longitude);
      if (place.photoUrl) {
        imageUrlInput.value = String(place.photoUrl);
      }

      if (!categoryInput.value) {
        const inferred = inferCategoryFromTypes(place.types || []);
        if (inferred) {
          categoryInput.value = inferred;
        }
      }

      updateImagePreview();
    }

    function handleGoogleResultCheck(event) {
      const inputEl = event.target.closest('input[data-google-index]');
      if (!inputEl) {
        return;
      }

      const idx = Number(inputEl.dataset.googleIndex);
      if (!Number.isFinite(idx)) {
        return;
      }

      if (inputEl.checked) {
        selectedGoogleIndexes.add(idx);
        applyGoogleCandidateToForm(googleCandidates[idx]);
        setStatus(`선택 변경: ${googleCandidates[idx]?.displayName || '장소'} 정보로 폼을 갱신했습니다.`);
      } else {
        selectedGoogleIndexes.delete(idx);
        const remains = getSelectedGoogleCandidates();
        if (remains.length > 0) {
          applyGoogleCandidateToForm(remains[0]);
          setStatus(`선택 변경: ${remains[0]?.displayName || '장소'} 정보로 폼을 갱신했습니다.`);
        } else {
          setStatus('선택된 Google 결과가 없습니다. 다른 항목을 선택해 주세요.');
        }
      }
    }

    function updateImagePreview() {
      const src = imageUrlInput.value.trim();
      if (!src) {
        imagePreviewEl.textContent = '이미지 경로를 입력하면 미리보기가 표시됩니다.';
        return;
      }

      imagePreviewEl.innerHTML = '';
      const img = document.createElement('img');
      img.alt = '이미지 미리보기';
      img.src = src;
      img.addEventListener('error', () => {
        imagePreviewEl.textContent = `이미지 로드 실패: ${src}`;
      });
      imagePreviewEl.appendChild(img);
    }

    function inferCategoryFromTypes(types) {
      if (!Array.isArray(types)) {
        return '';
      }

      const lowered = types.map((value) => String(value || '').toLowerCase());
      if (lowered.some((t) => t.includes('restaurant') || t.includes('food'))) {
        return '맛집';
      }
      if (lowered.some((t) => t.includes('cafe') || t.includes('coffee'))) {
        return '카페';
      }
      if (lowered.some((t) => t.includes('lodging') || t.includes('hotel') || t.includes('accommodation'))) {
        return '숙소';
      }
      if (lowered.some((t) => t.includes('shopping') || t.includes('store') || t.includes('mall'))) {
        return '쇼핑';
      }
      if (lowered.some((t) => t.includes('museum') || t.includes('tourist') || t.includes('landmark') || t.includes('park'))) {
        return '관광지';
      }
      return '';
    }

    function clearEditMode(resetForm = false) {
      editingId = null;
      saveBtn.textContent = '리스트에 추가';
      cancelEditBtn.style.display = 'none';
      if (resetForm) {
        clearFormOnly();
      }
      listBodyEl.querySelectorAll('tr.editing-row').forEach((row) => row.classList.remove('editing-row'));
    }

    function ensureOption(selectEl, value) {
      if (!value) {
        return;
      }
      const hasOption = Array.from(selectEl.options).some((opt) => opt.value === value);
      if (!hasOption) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = value;
        selectEl.appendChild(opt);
      }
    }

    function applyRowHighlight() {
      listBodyEl.querySelectorAll('tr[data-id]').forEach((row) => {
        row.classList.toggle('editing-row', Number(row.dataset.id) === editingId);
      });
    }

    function startEdit(item) {
      editingId = Number(item.id);
      saveBtn.textContent = '수정 저장';
      cancelEditBtn.style.display = 'inline-flex';

      ensureOption(countrySelect, item.country || '');
      countrySelect.value = item.country || '';
      updateCityOptions();
      ensureOption(citySelect, item.city || '');
      citySelect.value = item.city || '';
      ensureOption(categoryInput, item.category || '');

      attractionInput.value = item.attraction || '';
      mapsUrlInput.value = item.maps_url || '';
      addressInput.value = item.address || '';
      latitudeInput.value = item.latitude == null ? '' : String(item.latitude);
      longitudeInput.value = item.longitude == null ? '' : String(item.longitude);
      categoryInput.value = item.category || '';
      detailInput.value = item.detail || '';
      imageUrlInput.value = item.image_url || '';
      updateImagePreview();

      applyRowHighlight();
      setStatus(`수정 모드: ID ${editingId} (행 더블클릭으로 선택됨)`);
    }

    function updateCityOptions() {
      const country = countrySelect.value || '';
      const cities = cityOptions[country] || [];
      const prev = citySelect.value;
      citySelect.innerHTML = '<option value="">도시를 선택하세요</option>';

      cities.forEach((city) => {
        const opt = document.createElement('option');
        opt.value = city;
        opt.textContent = city;
        citySelect.appendChild(opt);
      });

      if (cities.includes(prev)) {
        citySelect.value = prev;
      }

      loadRegisteredList();
    }

    function renderList(items) {
      currentItems = Array.isArray(items) ? items : [];

      if (!Array.isArray(items) || items.length === 0) {
        listBodyEl.innerHTML = '<tr><td class="empty-row" colspan="10">선택한 조건의 등록 데이터가 없습니다.</td></tr>';
        listSummaryEl.textContent = '0건';
        clearEditMode(false);
        return;
      }

      const rows = items.map((item) => {
        const detail = item.detail ? String(item.detail) : '-';
        const lat = item.latitude == null ? '-' : String(item.latitude);
        const lng = item.longitude == null ? '-' : String(item.longitude);
        const imageUrl = String(item.image_url || '').trim();
        const imageCell = imageUrl
          ? `<img class="list-thumb" src="${escapeHtml(imageUrl)}" alt="thumb" onerror="this.style.display='none'" />${escapeHtml(imageUrl)}`
          : '-';
        return `
          <tr data-id="${escapeHtml(item.id ?? '')}">
            <td class="col-id">${escapeHtml(item.id ?? '-')}</td>
            <td class="col-country">${escapeHtml(item.country ?? '')}</td>
            <td class="col-city">${escapeHtml(item.city ?? '')}</td>
            <td class="col-attraction">${escapeHtml(item.attraction ?? '')}</td>
            <td class="col-category">${escapeHtml(item.category ?? '')}</td>
            <td class="col-address">${escapeHtml(item.address ?? '')}</td>
            <td class="col-lat">${escapeHtml(lat)}</td>
            <td class="col-lng">${escapeHtml(lng)}</td>
            <td class="col-image">${imageCell}</td>
            <td class="col-detail">${escapeHtml(detail)}</td>
          </tr>
        `;
      });

      listBodyEl.innerHTML = rows.join('');
      listSummaryEl.textContent = `${items.length}건`;
      applyRowHighlight();
    }

    async function loadRegisteredList() {
      const params = new URLSearchParams();
      if (countrySelect.value) {
        params.set('country', countrySelect.value);
      }
      if (citySelect.value) {
        params.set('city', citySelect.value);
      }

      if (!countrySelect.value || !citySelect.value) {
        listBodyEl.innerHTML = '<tr><td class="empty-row" colspan="10">국가와 도시를 선택하면 등록 리스트를 보여드립니다.</td></tr>';
        listSummaryEl.textContent = '0건';
        currentItems = [];
        clearEditMode(false);
        return;
      }

      const url = `/api/location-info/list?${params.toString()}`;
      listBodyEl.innerHTML = '<tr><td class="empty-row" colspan="10">등록 리스트를 불러오는 중...</td></tr>';

      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) {
          throw new Error(`목록 조회 실패: ${res.status}`);
        }
        const payload = await res.json();
        renderList(payload.items || []);
      } catch (error) {
        console.error(error);
        listBodyEl.innerHTML = '<tr><td class="empty-row" colspan="10">등록 리스트 조회에 실패했습니다.</td></tr>';
        listSummaryEl.textContent = '-';
        currentItems = [];
      }
    }

    async function parseGoogleMapsLink() {
      const mapsUrl = mapsUrlInput.value.trim();
      if (!mapsUrl) {
        setStatus('구글맵스 링크를 먼저 입력하세요.');
        return;
      }

      parseMapsBtn.disabled = true;
      setStatus('구글맵스 링크 파싱 중...');

      try {
        const res = await fetch('/api/maps-resolve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ maps_url: mapsUrl }),
        });
        const payload = await res.json();
        if (!res.ok) {
          throw new Error(payload.error || '링크 파싱 실패');
        }

        if (payload.final_url) {
          mapsUrlInput.value = payload.final_url;
        }
        if (payload.place_name) {
          addressInput.value = payload.place_name;
          if (!attractionInput.value.trim()) {
            attractionInput.value = payload.place_name;
          }
        }
        latitudeInput.value = payload.latitude == null ? '' : String(payload.latitude);
        longitudeInput.value = payload.longitude == null ? '' : String(payload.longitude);
        if (payload.photo_url) {
          imageUrlInput.value = String(payload.photo_url);
        }
        updateImagePreview();
        const hasCoords = payload.latitude != null && payload.longitude != null;
        if (!hasCoords) {
          setStatus('링크 파싱 완료: 장소명은 찾았지만 위도/경도는 추출하지 못했습니다. 다른 공유 링크를 시도해 주세요.');
        } else {
          setStatus(payload.photo_url
            ? '링크 파싱 완료: 주소/위도/경도/이미지를 채웠습니다.'
            : '링크 파싱 완료: 주소/위도/경도를 채웠습니다. (이미지는 미발견)');
        }
      } catch (error) {
        console.error(error);
        setStatus(`링크 파싱 실패: ${error.message}`);
      } finally {
        parseMapsBtn.disabled = false;
      }
    }

    async function autofillByGooglePlaces() {
      const attraction = attractionInput.value.trim();
      const city = citySelect.value.trim();
      const country = countrySelect.value.trim();

      if (!attraction) {
        setStatus('관광지명을 먼저 입력한 뒤 Google 자동 채우기를 눌러주세요.');
        attractionInput.focus();
        return;
      }

      const query = [attraction, city, country].filter(Boolean).join(' ');
      if (!query) {
        setStatus('검색어를 만들 수 없습니다. 국가/도시/관광지명을 확인하세요.');
        return;
      }

      setGoogleActionButtonsDisabled(true);
      googleResultBodyEl.innerHTML = '<tr><td class="empty-row" colspan="5">Google 검색 중...</td></tr>';
      setStatus('Google Places에서 장소 정보를 조회 중...');

      try {
        const res = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query,
            search_type: 'text',
            max_rows: 10,
          }),
        });

        const payload = await res.json();
        if (!res.ok) {
          throw new Error(payload.error || 'Google 검색 실패');
        }

        const places = Array.isArray(payload.places) ? payload.places : [];
        if (places.length === 0) {
          googleCandidates = [];
          selectedGoogleIndexes.clear();
          renderGoogleResults();
          setStatus('Google Places 검색 결과가 없습니다. 관광지명을 조금 더 구체적으로 입력해 주세요.');
          return;
        }

        googleCandidates = places;
        selectedGoogleIndexes.clear();

        const loweredAttraction = attraction.toLowerCase();
        const pickedIndex = places.findIndex((place) => String(place.displayName || '').toLowerCase().includes(loweredAttraction));
        selectedGoogleIndexes.add(pickedIndex >= 0 ? pickedIndex : 0);

        renderGoogleResults();
        applyGoogleCandidateToForm(places[pickedIndex >= 0 ? pickedIndex : 0]);
        setStatus('Google 검색 완료: 후보를 선택한 뒤 자동 채우기/전체 저장을 진행하세요.');
      } catch (error) {
        console.error(error);
        googleCandidates = [];
        selectedGoogleIndexes.clear();
        renderGoogleResults();
        setStatus(`Google 자동 채우기 실패: ${error.message}`);
      } finally {
        setGoogleActionButtonsDisabled(false);
      }
    }

    async function addCountryCityOption() {
      const country = newCountryInput.value.trim();
      const city = newCityInput.value.trim();
      if (!country || !city) {
        setStatus('국가와 도시를 모두 입력한 뒤 추가하세요.');
        return;
      }

      addCountryCityBtn.disabled = true;
      setStatus('국가/도시 옵션 추가 중...');

      try {
        const res = await fetch('/api/location-info/options', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ country, city }),
        });
        const payload = await res.json();
        if (!res.ok) {
          throw new Error(payload.error || '옵션 추가 실패');
        }

        await loadComboOptions();
        ensureOption(countrySelect, country);
        countrySelect.value = country;
        updateCityOptions();
        ensureOption(citySelect, city);
        citySelect.value = city;
        await loadRegisteredList();

        newCountryInput.value = '';
        newCityInput.value = '';
        setStatus(`국가/도시 옵션 추가 완료: ${country} / ${city}`);
      } catch (error) {
        console.error(error);
        setStatus(`국가/도시 옵션 추가 실패: ${error.message}`);
      } finally {
        addCountryCityBtn.disabled = false;
      }
    }

    async function loadComboOptions() {
      const prevCountry = countrySelect.value;
      const prevCity = citySelect.value;

      try {
        const res = await fetch('/api/location-info/options', { cache: 'no-store' });
        if (!res.ok) {
          throw new Error(`옵션 조회 실패: ${res.status}`);
        }

        const payload = await res.json();
        const countries = Array.isArray(payload.countries) ? payload.countries : [];
        cityOptions = payload.cities_by_country || {};

        countrySelect.innerHTML = '<option value="">국가를 선택하세요</option>';
        countries.forEach((country) => {
          const opt = document.createElement('option');
          opt.value = country;
          opt.textContent = country;
          countrySelect.appendChild(opt);
        });

        if (prevCountry && countries.includes(prevCountry)) {
          countrySelect.value = prevCountry;
        }

        updateCityOptions();
        if (prevCity && Array.isArray(cityOptions[countrySelect.value]) && cityOptions[countrySelect.value].includes(prevCity)) {
          citySelect.value = prevCity;
        }
        await loadRegisteredList();
        setStatus('콤보 데이터를 불러왔습니다. 등록 리스트를 확인하고 추가하세요.');
      } catch (error) {
        console.error(error);
        setStatus('콤보 데이터 로드 실패: LocationInfo 테이블 연결을 확인하세요.');
      }
    }

    async function saveLocationInfo(event) {
      event.preventDefault();

      const body = {
        country: countrySelect.value.trim(),
        city: citySelect.value.trim(),
        maps_url: mapsUrlInput.value.trim(),
        address: addressInput.value.trim(),
        latitude: latitudeInput.value.trim(),
        longitude: longitudeInput.value.trim(),
        category: categoryInput.value.trim(),
        attraction: attractionInput.value.trim(),
        detail: detailInput.value.trim(),
        image_url: imageUrlInput.value.trim(),
      };

      saveBtn.disabled = true;
      setStatus(editingId ? '수정 중...' : '저장 중...');

      try {
        const isEdit = Boolean(editingId);
        const url = isEdit ? `/api/location-info/${editingId}` : '/api/location-info';
        const method = isEdit ? 'PUT' : 'POST';
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        const payload = await res.json();
        if (!res.ok) {
          throw new Error(payload.error || '저장 실패');
        }

        if (isEdit) {
          setStatus(`수정 완료 (ID: ${payload.id ?? '-'})`);
          clearEditMode(true);
        } else {
          setStatus(`저장 완료 (ID: ${payload.id ?? '-'})`);
          clearFormOnly();
        }

        await loadComboOptions();
      } catch (error) {
        console.error(error);
        setStatus(`${editingId ? '수정' : '저장'} 실패: ${error.message}`);
      } finally {
        saveBtn.disabled = false;
      }
    }

    function handleListDoubleClick(event) {
      const row = event.target.closest('tr[data-id]');
      if (!row) {
        return;
      }

      const rowId = Number(row.dataset.id);
      if (!Number.isFinite(rowId)) {
        return;
      }

      const item = currentItems.find((entry) => Number(entry.id) === rowId);
      if (!item) {
        return;
      }

      startEdit(item);
    }

    countrySelect.addEventListener('change', updateCityOptions);
    citySelect.addEventListener('change', loadRegisteredList);
    parseMapsBtn.addEventListener('click', parseGoogleMapsLink);
    fillFromGoogleBtn.addEventListener('click', autofillByGooglePlaces);
    selectAllGoogleBtn.addEventListener('click', () => {
      selectedGoogleIndexes.clear();
      googleCandidates.forEach((_, idx) => selectedGoogleIndexes.add(idx));
      renderGoogleResults();
      if (googleCandidates.length > 0) {
        applyGoogleCandidateToForm(googleCandidates[0]);
        setStatus(`전체 선택: ${googleCandidates[0]?.displayName || '첫 번째 장소'} 정보로 폼을 갱신했습니다.`);
      }
    });
    clearGoogleSelectionBtn.addEventListener('click', () => {
      selectedGoogleIndexes.clear();
      renderGoogleResults();
      setStatus('Google 결과 선택을 모두 해제했습니다.');
    });
    googleResultBodyEl.addEventListener('change', handleGoogleResultCheck);
    addCountryCityBtn.addEventListener('click', addCountryCityOption);
    refreshListBtn.addEventListener('click', loadRegisteredList);
    cancelEditBtn.addEventListener('click', () => clearEditMode(true));
    imageUrlInput.addEventListener('input', updateImagePreview);
    listBodyEl.addEventListener('dblclick', handleListDoubleClick);
    formEl.addEventListener('submit', saveLocationInfo);
    loadComboOptions();
  </script>
</body>
</html>
