<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여행 피드</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Serif KR", "Malgun Gothic", serif;
      background:
        radial-gradient(circle at 15% 0%, #d8ecff 0%, rgba(216, 236, 255, 0) 42%),
        radial-gradient(circle at 88% 0%, #c7e2ff 0%, rgba(199, 226, 255, 0) 44%),
        linear-gradient(180deg, #eef7ff 0%, #dceeff 100%);
      color: #153454;
    }
    .wrap {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid #bcd8f5;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 14px 30px rgba(33, 88, 146, 0.14);
      backdrop-filter: blur(3px);
    }
    h1 {
      margin: 0;
      font-size: 28px;
      color: #0f4f8a;
    }
    .desc {
      margin: 8px 0 0;
      color: #2f628e;
      font-size: 14px;
    }
    .top-row {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .page-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: 700;
      color: #1f5fb5;
      background: #e9f2ff;
      border: 1px solid #bcd8f5;
    }
    .page-link:hover {
      background: #dfeeff;
    }
    .combo-grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      color: #1e5284;
    }
    select {
      width: 100%;
      border: 1px solid #bcd8f5;
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 15px;
      background: #f7fbff;
      color: #1f4e7f;
      font-family: inherit;
    }
    .feed-wrap {
      margin-top: 16px;
      border: 1px solid #cfe1f4;
      border-radius: 14px;
      background: #fafdff;
      overflow: hidden;
    }
    .feed-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 12px;
      background: linear-gradient(135deg, #edf6ff 0%, #e4f0ff 100%);
      border-bottom: 1px solid #cfe1f4;
      color: #205689;
      font-weight: 700;
    }
    .feed-head-left {
      display: inline-flex;
      gap: 8px;
      align-items: baseline;
      flex-wrap: wrap;
    }
    .feed-hint {
      font-size: 12px;
      font-weight: 600;
      color: #4f7ea8;
    }
    .feed-grid {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .feed-empty {
      grid-column: 1 / -1;
      border: 1px dashed #bdd6f2;
      border-radius: 12px;
      padding: 20px 14px;
      text-align: center;
      color: #567fa5;
      background: #f6fbff;
    }
    .post-card {
      border: 1px solid #d6e7f9;
      border-radius: 14px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(24, 93, 158, 0.12);
      cursor: pointer;
    }
    .post-card:hover {
      box-shadow: 0 10px 24px rgba(24, 93, 158, 0.2);
    }
    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #e8f1fb;
      background: #f9fcff;
    }
    .post-header-left {
      min-width: 0;
    }
    .post-city {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: #194f80;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .post-country {
      margin: 2px 0 0;
      font-size: 12px;
      color: #4f7ea8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .post-badge {
      flex-shrink: 0;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 800;
      color: #145690;
      border: 1px solid #bfdbf6;
      background: #e7f2ff;
    }
    .post-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: linear-gradient(145deg, #e8f3ff 0%, #d6e7fb 100%);
    }
    .post-body {
      padding: 10px 12px 12px;
    }
    .post-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      color: #1e5488;
      line-height: 1.35;
      word-break: keep-all;
    }
    .post-detail {
      margin: 8px 0 0;
      font-size: 13px;
      line-height: 1.45;
      color: #38648d;
      word-break: keep-all;
      min-height: 38px;
    }
    .post-meta {
      margin: 8px 0 0;
      font-size: 12px;
      color: #5c84aa;
      line-height: 1.35;
      word-break: break-word;
    }
    .post-actions {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .post-link {
      text-decoration: none;
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 700;
      color: #175993;
      border: 1px solid #c5ddf6;
      background: #eff6ff;
    }
    .post-link:hover {
      background: #e4f0ff;
    }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid #cfe1f4;
      border-radius: 10px;
      background: #f7fbff;
      color: #2f628e;
      font-size: 14px;
    }
    .edit-modal {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .edit-modal[hidden] {
      display: none;
    }
    .edit-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(17, 47, 80, 0.42);
      backdrop-filter: blur(2px);
    }
    .edit-modal-panel {
      position: relative;
      width: min(760px, 100%);
      max-height: calc(100vh - 32px);
      border: 1px solid #bcd8f5;
      border-radius: 18px;
      background: rgba(247, 251, 255, 0.98);
      box-shadow: 0 16px 36px rgba(22, 74, 125, 0.24);
      padding: 14px;
      overflow: auto;
    }
    .edit-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .edit-modal-title {
      margin: 0;
      color: #1f5a95;
      font-size: 24px;
    }
    .edit-modal-actions {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }
    .edit-close-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      padding: 0;
      font-size: 24px;
      color: #2f628e;
      border: 1px solid #a9c7e8;
      background: #e6f0ff;
      box-shadow: none;
      line-height: 1;
    }
    .edit-grid {
      display: grid;
      gap: 10px;
    }
    .edit-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .edit-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .edit-grid textarea,
    .edit-grid input,
    .edit-grid select {
      width: 100%;
      border: 1px solid #bcd8f5;
      border-radius: 10px;
      padding: 10px 11px;
      font-size: 14px;
      background: #f7fbff;
      color: #1f4e7f;
      font-family: inherit;
    }
    .edit-grid textarea {
      min-height: 90px;
      resize: vertical;
    }
    .edit-mini-note {
      margin: 0;
      color: #4f7ea8;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .combo-grid {
        grid-template-columns: 1fr;
      }
      .feed-grid {
        grid-template-columns: 1fr;
      }
      .edit-grid-2,
      .edit-grid-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>여행 피드</h1>
      <p class="desc">저장된 여행 정보를 인스타 스타일로 확인합니다.</p>

      <div class="top-row">
        <div></div>
        <a class="page-link" href="/trip-info">여행 정보 입력하기</a>
      </div>

      <div class="combo-grid">
        <div>
          <label for="feedCountry">국가 선택</label>
          <select id="feedCountry" required>
            <option value="">국가를 선택하세요</option>
          </select>
        </div>
        <div>
          <label for="feedCity">도시 선택</label>
          <select id="feedCity" required>
            <option value="">도시를 선택하세요</option>
          </select>
        </div>
      </div>

      <div class="feed-wrap">
        <div class="feed-head">
          <span class="feed-head-left">
            <span>인스타 스타일 피드</span>
            <span class="feed-hint">카드 더블클릭으로 수정</span>
          </span>
          <span id="feedSummary">0개 포스트</span>
        </div>
        <div id="tripFeed" class="feed-grid">
          <div class="feed-empty">국가와 도시를 선택하면 여행 포스트가 표시됩니다.</div>
        </div>
      </div>

      <div id="feedStatus" class="status">콤보 데이터를 불러오는 중...</div>
    </section>
  </main>

  <section id="feedEditModal" class="edit-modal" hidden>
    <div id="feedEditBackdrop" class="edit-modal-backdrop"></div>
    <div class="edit-modal-panel">
      <div class="edit-modal-head">
        <p id="feedEditTitle" class="edit-modal-title">포스트 수정</p>
        <div class="edit-modal-actions">
          <button id="feedEditSaveBtn" type="button">저장</button>
          <button id="feedEditCloseBtn" type="button" class="edit-close-btn" aria-label="닫기">×</button>
        </div>
      </div>
      <div class="edit-grid">
        <p class="edit-mini-note">국가/도시는 유지하고, 장소 정보만 수정합니다.</p>
        <div>
          <label for="feedEditAttraction">관광지명</label>
          <input id="feedEditAttraction" />
        </div>
        <div class="edit-grid-3">
          <div>
            <label for="feedEditCategory">구분</label>
            <select id="feedEditCategory">
              <option value="">구분 선택</option>
              <option value="랜드마크">랜드마크</option>
              <option value="관광지">관광지</option>
              <option value="맛집">맛집</option>
              <option value="카페">카페</option>
              <option value="숙소">숙소</option>
              <option value="쇼핑">쇼핑</option>
              <option value="기타">기타</option>
            </select>
          </div>
          <div>
            <label for="feedEditLatitude">위도</label>
            <input id="feedEditLatitude" placeholder="예: 37.5665" />
          </div>
          <div>
            <label for="feedEditLongitude">경도</label>
            <input id="feedEditLongitude" placeholder="예: 126.9780" />
          </div>
        </div>
        <div>
          <label for="feedEditAddress">주소</label>
          <input id="feedEditAddress" />
        </div>
        <div>
          <label for="feedEditMapsUrl">구글맵 링크</label>
          <input id="feedEditMapsUrl" placeholder="https://maps.google.com/..." />
        </div>
        <div>
          <label for="feedEditImageUrl">이미지 경로</label>
          <input id="feedEditImageUrl" />
        </div>
        <div>
          <label for="feedEditDetail">상세 설명</label>
          <textarea id="feedEditDetail"></textarea>
        </div>
      </div>
    </div>
  </section>

  <script>
    const countrySelect = document.getElementById('feedCountry');
    const citySelect = document.getElementById('feedCity');
    const feedEl = document.getElementById('tripFeed');
    const feedSummaryEl = document.getElementById('feedSummary');
    const statusEl = document.getElementById('feedStatus');
    const feedEditModal = document.getElementById('feedEditModal');
    const feedEditBackdrop = document.getElementById('feedEditBackdrop');
    const feedEditCloseBtn = document.getElementById('feedEditCloseBtn');
    const feedEditSaveBtn = document.getElementById('feedEditSaveBtn');
    const feedEditTitle = document.getElementById('feedEditTitle');
    const feedEditAttraction = document.getElementById('feedEditAttraction');
    const feedEditCategory = document.getElementById('feedEditCategory');
    const feedEditAddress = document.getElementById('feedEditAddress');
    const feedEditLatitude = document.getElementById('feedEditLatitude');
    const feedEditLongitude = document.getElementById('feedEditLongitude');
    const feedEditMapsUrl = document.getElementById('feedEditMapsUrl');
    const feedEditImageUrl = document.getElementById('feedEditImageUrl');
    const feedEditDetail = document.getElementById('feedEditDetail');

    let cityOptions = {};
    let currentFeedItems = [];
    let editingItemId = null;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function buildMapsUrl(item) {
      const direct = String(item.maps_url || '').trim();
      if (direct) {
        return direct;
      }

      if (item.latitude != null && item.longitude != null) {
        return `https://www.google.com/maps?q=${encodeURIComponent(`${item.latitude},${item.longitude}`)}`;
      }

      const query = String(item.address || item.attraction || '').trim();
      if (query) {
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      }

      return '';
    }

    function openEditModal(item) {
      if (!item || !item.id) {
        return;
      }

      editingItemId = Number(item.id);
      feedEditTitle.textContent = `포스트 수정 (ID: ${editingItemId})`;
      feedEditAttraction.value = String(item.attraction || '');
      feedEditCategory.value = String(item.category || '');
      feedEditAddress.value = String(item.address || '');
      feedEditLatitude.value = item.latitude == null ? '' : String(item.latitude);
      feedEditLongitude.value = item.longitude == null ? '' : String(item.longitude);
      feedEditMapsUrl.value = String(item.maps_url || '');
      feedEditImageUrl.value = String(item.image_url || '');
      feedEditDetail.value = String(item.detail || '');
      feedEditModal.hidden = false;
    }

    function closeEditModal() {
      feedEditModal.hidden = true;
      editingItemId = null;
    }

    async function saveEditModal() {
      if (!editingItemId) {
        return;
      }

      const current = currentFeedItems.find((entry) => Number(entry.id) === Number(editingItemId));
      if (!current) {
        setStatus('수정할 원본 데이터를 찾지 못했습니다. 목록을 다시 불러옵니다.');
        await loadFeedItems();
        closeEditModal();
        return;
      }

      const body = {
        country: String(current.country || '').trim(),
        city: String(current.city || '').trim(),
        attraction: feedEditAttraction.value.trim(),
        detail: feedEditDetail.value.trim(),
        image_url: feedEditImageUrl.value.trim(),
        maps_url: feedEditMapsUrl.value.trim(),
        address: feedEditAddress.value.trim(),
        latitude: feedEditLatitude.value.trim(),
        longitude: feedEditLongitude.value.trim(),
        category: feedEditCategory.value.trim(),
      };

      if (!body.attraction) {
        setStatus('관광지명은 비워둘 수 없습니다.');
        feedEditAttraction.focus();
        return;
      }

      feedEditSaveBtn.disabled = true;
      setStatus('수정 저장 중...');
      try {
        const res = await fetch(`/api/location-info/${editingItemId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const payload = await res.json();
        if (!res.ok) {
          throw new Error(payload.error || '수정 실패');
        }

        closeEditModal();
        await loadFeedItems();
        setStatus(`수정 완료 (ID: ${payload.id ?? editingItemId})`);
      } catch (error) {
        console.error(error);
        setStatus(`수정 실패: ${error.message}`);
      } finally {
        feedEditSaveBtn.disabled = false;
      }
    }

    function renderFeed(items) {
      currentFeedItems = Array.isArray(items) ? items : [];
      if (!Array.isArray(items) || items.length === 0) {
        feedEl.innerHTML = '<div class="feed-empty">선택한 국가/도시에 해당하는 여행 포스트가 없습니다.</div>';
        feedSummaryEl.textContent = '0개 포스트';
        return;
      }

      const cards = items.map((item) => {
        const title = escapeHtml(item.attraction || '이름 없는 장소');
        const country = escapeHtml(item.country || '국가 미상');
        const city = escapeHtml(item.city || '도시 미상');
        const category = escapeHtml(item.category || '기타');
        const detail = escapeHtml(item.detail || '상세 설명이 아직 등록되지 않았습니다.');
        const address = escapeHtml(item.address || '주소 정보 없음');
        const imageUrl = String(item.image_url || '').trim();
        const mapsUrl = buildMapsUrl(item);
        const imageHtml = imageUrl
          ? `<img class="post-image" src="${escapeHtml(imageUrl)}" alt="${title}" onerror="this.style.display='none'" />`
          : '<div class="post-image"></div>';
        const mapsHtml = mapsUrl
          ? `<a class="post-link" href="${escapeHtml(mapsUrl)}" target="_blank" rel="noopener">지도 보기</a>`
          : '';

        return `
          <article class="post-card" data-id="${escapeHtml(item.id ?? '')}">
            <div class="post-header">
              <div class="post-header-left">
                <p class="post-city">${city}</p>
                <p class="post-country">${country}</p>
              </div>
              <span class="post-badge">${category}</span>
            </div>
            ${imageHtml}
            <div class="post-body">
              <p class="post-title">${title}</p>
              <p class="post-detail">${detail}</p>
              <p class="post-meta">${address}</p>
              <div class="post-actions">${mapsHtml}</div>
            </div>
          </article>
        `;
      });

      feedEl.innerHTML = cards.join('');
      feedSummaryEl.textContent = `${items.length}개 포스트`;
    }

    async function loadFeedItems() {
      const country = countrySelect.value;
      const city = citySelect.value;

      if (!country) {
        feedEl.innerHTML = '<div class="feed-empty">국가를 선택하면 여행 포스트를 보여드립니다.</div>';
        feedSummaryEl.textContent = '0개 포스트';
        return;
      }

      const params = new URLSearchParams({ country });
      if (city) {
        params.set('city', city);
      }
      const url = `/api/location-info/list?${params.toString()}`;
      feedEl.innerHTML = '<div class="feed-empty">포스트를 불러오는 중...</div>';

      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) {
          throw new Error(`목록 조회 실패: ${res.status}`);
        }

        const payload = await res.json();
        renderFeed(payload.items || []);
        setStatus(city ? `조회 완료: ${country} / ${city}` : `조회 완료: ${country} (전체 도시)`);
      } catch (error) {
        console.error(error);
        feedEl.innerHTML = '<div class="feed-empty">포스트 조회에 실패했습니다.</div>';
        feedSummaryEl.textContent = '-';
        setStatus(`포스트 조회 실패: ${error.message}`);
      }
    }

    function updateCityOptions() {
      const country = countrySelect.value || '';
      const cities = cityOptions[country] || [];
      const prevCity = citySelect.value;

      citySelect.innerHTML = '<option value="">도시를 선택하세요</option>';
      cities.forEach((city) => {
        const opt = document.createElement('option');
        opt.value = city;
        opt.textContent = city;
        citySelect.appendChild(opt);
      });

      if (cities.includes(prevCity)) {
        citySelect.value = prevCity;
      }

      loadFeedItems();
    }

    function handleFeedDoubleClick(event) {
      const card = event.target.closest('.post-card[data-id]');
      if (!card) {
        return;
      }

      const itemId = Number(card.dataset.id);
      if (!Number.isFinite(itemId)) {
        return;
      }

      const item = currentFeedItems.find((entry) => Number(entry.id) === itemId);
      if (!item) {
        return;
      }

      openEditModal(item);
    }

    async function loadComboOptions() {
      const prevCountry = countrySelect.value;
      const prevCity = citySelect.value;

      try {
        const res = await fetch('/api/location-info/options', { cache: 'no-store' });
        if (!res.ok) {
          throw new Error(`옵션 조회 실패: ${res.status}`);
        }

        const payload = await res.json();
        const countries = Array.isArray(payload.countries) ? payload.countries : [];
        cityOptions = payload.cities_by_country || {};

        countrySelect.innerHTML = '<option value="">국가를 선택하세요</option>';
        countries.forEach((country) => {
          const opt = document.createElement('option');
          opt.value = country;
          opt.textContent = country;
          countrySelect.appendChild(opt);
        });

        if (prevCountry && countries.includes(prevCountry)) {
          countrySelect.value = prevCountry;
        }

        updateCityOptions();
        const cities = cityOptions[countrySelect.value] || [];
        if (prevCity && cities.includes(prevCity)) {
          citySelect.value = prevCity;
          loadFeedItems();
        }

        setStatus('콤보 데이터를 불러왔습니다. 국가를 먼저 선택하세요.');
      } catch (error) {
        console.error(error);
        setStatus('콤보 데이터 로드 실패: LocationInfo 테이블 연결을 확인하세요.');
      }
    }

    countrySelect.addEventListener('change', updateCityOptions);
    citySelect.addEventListener('change', loadFeedItems);
    feedEl.addEventListener('dblclick', handleFeedDoubleClick);
    feedEditBackdrop.addEventListener('click', closeEditModal);
    feedEditCloseBtn.addEventListener('click', closeEditModal);
    feedEditSaveBtn.addEventListener('click', () => {
      saveEditModal();
    });

    loadComboOptions();
  </script>
</body>
</html>
