<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여행 피드</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Serif KR", "Malgun Gothic", serif;
      background:
        radial-gradient(circle at 15% 0%, #d8ecff 0%, rgba(216, 236, 255, 0) 42%),
        radial-gradient(circle at 88% 0%, #c7e2ff 0%, rgba(199, 226, 255, 0) 44%),
        linear-gradient(180deg, #eef7ff 0%, #dceeff 100%);
      color: #153454;
    }
    .wrap {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid #bcd8f5;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 14px 30px rgba(33, 88, 146, 0.14);
      backdrop-filter: blur(3px);
    }
    h1 {
      margin: 0;
      font-size: 28px;
      color: #0f4f8a;
    }
    .desc {
      margin: 8px 0 0;
      color: #2f628e;
      font-size: 14px;
    }
    .top-row {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .page-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: 700;
      color: #1f5fb5;
      background: #e9f2ff;
      border: 1px solid #bcd8f5;
    }
    .page-link:hover {
      background: #dfeeff;
    }
    .combo-grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      color: #1e5284;
    }
    select {
      width: 100%;
      border: 1px solid #bcd8f5;
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 15px;
      background: #f7fbff;
      color: #1f4e7f;
      font-family: inherit;
    }
    .feed-wrap {
      margin-top: 16px;
      border: 1px solid #cfe1f4;
      border-radius: 14px;
      background: #fafdff;
      overflow: hidden;
    }
    .feed-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 12px;
      background: linear-gradient(135deg, #edf6ff 0%, #e4f0ff 100%);
      border-bottom: 1px solid #cfe1f4;
      color: #205689;
      font-weight: 700;
    }
    .feed-grid {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .feed-empty {
      grid-column: 1 / -1;
      border: 1px dashed #bdd6f2;
      border-radius: 12px;
      padding: 20px 14px;
      text-align: center;
      color: #567fa5;
      background: #f6fbff;
    }
    .post-card {
      border: 1px solid #d6e7f9;
      border-radius: 14px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(24, 93, 158, 0.12);
    }
    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #e8f1fb;
      background: #f9fcff;
    }
    .post-header-left {
      min-width: 0;
    }
    .post-city {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: #194f80;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .post-country {
      margin: 2px 0 0;
      font-size: 12px;
      color: #4f7ea8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .post-badge {
      flex-shrink: 0;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 800;
      color: #145690;
      border: 1px solid #bfdbf6;
      background: #e7f2ff;
    }
    .post-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: linear-gradient(145deg, #e8f3ff 0%, #d6e7fb 100%);
    }
    .post-body {
      padding: 10px 12px 12px;
    }
    .post-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      color: #1e5488;
      line-height: 1.35;
      word-break: keep-all;
    }
    .post-detail {
      margin: 8px 0 0;
      font-size: 13px;
      line-height: 1.45;
      color: #38648d;
      word-break: keep-all;
      min-height: 38px;
    }
    .post-meta {
      margin: 8px 0 0;
      font-size: 12px;
      color: #5c84aa;
      line-height: 1.35;
      word-break: break-word;
    }
    .post-actions {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .post-link {
      text-decoration: none;
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 700;
      color: #175993;
      border: 1px solid #c5ddf6;
      background: #eff6ff;
    }
    .post-link:hover {
      background: #e4f0ff;
    }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid #cfe1f4;
      border-radius: 10px;
      background: #f7fbff;
      color: #2f628e;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .combo-grid {
        grid-template-columns: 1fr;
      }
      .feed-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>여행 피드</h1>
      <p class="desc">저장된 여행 정보를 인스타 스타일로 확인합니다.</p>

      <div class="top-row">
        <div></div>
        <a class="page-link" href="/trip-info">여행 정보 입력하기</a>
      </div>

      <div class="combo-grid">
        <div>
          <label for="feedCountry">국가 선택</label>
          <select id="feedCountry" required>
            <option value="">국가를 선택하세요</option>
          </select>
        </div>
        <div>
          <label for="feedCity">도시 선택</label>
          <select id="feedCity" required>
            <option value="">도시를 선택하세요</option>
          </select>
        </div>
      </div>

      <div class="feed-wrap">
        <div class="feed-head">
          <span>인스타 스타일 피드</span>
          <span id="feedSummary">0개 포스트</span>
        </div>
        <div id="tripFeed" class="feed-grid">
          <div class="feed-empty">국가와 도시를 선택하면 여행 포스트가 표시됩니다.</div>
        </div>
      </div>

      <div id="feedStatus" class="status">콤보 데이터를 불러오는 중...</div>
    </section>
  </main>

  <script>
    const countrySelect = document.getElementById('feedCountry');
    const citySelect = document.getElementById('feedCity');
    const feedEl = document.getElementById('tripFeed');
    const feedSummaryEl = document.getElementById('feedSummary');
    const statusEl = document.getElementById('feedStatus');

    let cityOptions = {};

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function buildMapsUrl(item) {
      const direct = String(item.maps_url || '').trim();
      if (direct) {
        return direct;
      }

      if (item.latitude != null && item.longitude != null) {
        return `https://www.google.com/maps?q=${encodeURIComponent(`${item.latitude},${item.longitude}`)}`;
      }

      const query = String(item.address || item.attraction || '').trim();
      if (query) {
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      }

      return '';
    }

    function renderFeed(items) {
      if (!Array.isArray(items) || items.length === 0) {
        feedEl.innerHTML = '<div class="feed-empty">선택한 국가/도시에 해당하는 여행 포스트가 없습니다.</div>';
        feedSummaryEl.textContent = '0개 포스트';
        return;
      }

      const cards = items.map((item) => {
        const title = escapeHtml(item.attraction || '이름 없는 장소');
        const country = escapeHtml(item.country || '국가 미상');
        const city = escapeHtml(item.city || '도시 미상');
        const category = escapeHtml(item.category || '기타');
        const detail = escapeHtml(item.detail || '상세 설명이 아직 등록되지 않았습니다.');
        const address = escapeHtml(item.address || '주소 정보 없음');
        const imageUrl = String(item.image_url || '').trim();
        const mapsUrl = buildMapsUrl(item);
        const imageHtml = imageUrl
          ? `<img class="post-image" src="${escapeHtml(imageUrl)}" alt="${title}" onerror="this.style.display='none'" />`
          : '<div class="post-image"></div>';
        const mapsHtml = mapsUrl
          ? `<a class="post-link" href="${escapeHtml(mapsUrl)}" target="_blank" rel="noopener">지도 보기</a>`
          : '';

        return `
          <article class="post-card">
            <div class="post-header">
              <div class="post-header-left">
                <p class="post-city">${city}</p>
                <p class="post-country">${country}</p>
              </div>
              <span class="post-badge">${category}</span>
            </div>
            ${imageHtml}
            <div class="post-body">
              <p class="post-title">${title}</p>
              <p class="post-detail">${detail}</p>
              <p class="post-meta">${address}</p>
              <div class="post-actions">${mapsHtml}</div>
            </div>
          </article>
        `;
      });

      feedEl.innerHTML = cards.join('');
      feedSummaryEl.textContent = `${items.length}개 포스트`;
    }

    async function loadFeedItems() {
      const country = countrySelect.value;
      const city = citySelect.value;

      if (!country || !city) {
        feedEl.innerHTML = '<div class="feed-empty">국가와 도시를 선택하면 여행 포스트를 보여드립니다.</div>';
        feedSummaryEl.textContent = '0개 포스트';
        return;
      }

      const params = new URLSearchParams({ country, city });
      const url = `/api/location-info/list?${params.toString()}`;
      feedEl.innerHTML = '<div class="feed-empty">포스트를 불러오는 중...</div>';

      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) {
          throw new Error(`목록 조회 실패: ${res.status}`);
        }

        const payload = await res.json();
        renderFeed(payload.items || []);
        setStatus(`조회 완료: ${country} / ${city}`);
      } catch (error) {
        console.error(error);
        feedEl.innerHTML = '<div class="feed-empty">포스트 조회에 실패했습니다.</div>';
        feedSummaryEl.textContent = '-';
        setStatus(`포스트 조회 실패: ${error.message}`);
      }
    }

    function updateCityOptions() {
      const country = countrySelect.value || '';
      const cities = cityOptions[country] || [];
      const prevCity = citySelect.value;

      citySelect.innerHTML = '<option value="">도시를 선택하세요</option>';
      cities.forEach((city) => {
        const opt = document.createElement('option');
        opt.value = city;
        opt.textContent = city;
        citySelect.appendChild(opt);
      });

      if (cities.includes(prevCity)) {
        citySelect.value = prevCity;
      }

      loadFeedItems();
    }

    async function loadComboOptions() {
      const prevCountry = countrySelect.value;
      const prevCity = citySelect.value;

      try {
        const res = await fetch('/api/location-info/options', { cache: 'no-store' });
        if (!res.ok) {
          throw new Error(`옵션 조회 실패: ${res.status}`);
        }

        const payload = await res.json();
        const countries = Array.isArray(payload.countries) ? payload.countries : [];
        cityOptions = payload.cities_by_country || {};

        countrySelect.innerHTML = '<option value="">국가를 선택하세요</option>';
        countries.forEach((country) => {
          const opt = document.createElement('option');
          opt.value = country;
          opt.textContent = country;
          countrySelect.appendChild(opt);
        });

        if (prevCountry && countries.includes(prevCountry)) {
          countrySelect.value = prevCountry;
        }

        updateCityOptions();
        const cities = cityOptions[countrySelect.value] || [];
        if (prevCity && cities.includes(prevCity)) {
          citySelect.value = prevCity;
          loadFeedItems();
        }

        setStatus('콤보 데이터를 불러왔습니다. 국가와 도시를 선택하세요.');
      } catch (error) {
        console.error(error);
        setStatus('콤보 데이터 로드 실패: LocationInfo 테이블 연결을 확인하세요.');
      }
    }

    countrySelect.addEventListener('change', updateCityOptions);
    citySelect.addEventListener('change', loadFeedItems);

    loadComboOptions();
  </script>
</body>
</html>
