<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여행 피드</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Serif KR", "Malgun Gothic", serif;
      background:
        radial-gradient(circle at 15% 0%, #d8ecff 0%, rgba(216, 236, 255, 0) 42%),
        radial-gradient(circle at 88% 0%, #c7e2ff 0%, rgba(199, 226, 255, 0) 44%),
        linear-gradient(180deg, #eef7ff 0%, #dceeff 100%);
      color: #153454;
    }
    .wrap {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid #bcd8f5;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 14px 30px rgba(33, 88, 146, 0.14);
      backdrop-filter: blur(3px);
    }
    h1 {
      margin: 0;
      font-size: 28px;
      color: #0f4f8a;
      display: inline-block;
      margin-right: 12px;
    }
    .page-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: 700;
      color: #1f5fb5;
      background: #e9f2ff;
      border: 1px solid #bcd8f5;
    }
    button.page-link {
      box-shadow: none;
      cursor: pointer;
    }
    .page-link:hover {
      background: #dfeeff;
    }
    .desc {
      margin: 8px 0 0;
      color: #2f628e;
      font-size: 14px;
    }
    .combo-grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 0.9fr) minmax(0, 1.2fr);
      gap: 12px;
      align-items: end;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      color: #1e5284;
    }
    select {
      width: 100%;
      border: 1px solid #bcd8f5;
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 15px;
      background: #f7fbff;
      color: #1f4e7f;
      font-family: inherit;
    }
    .feed-search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }
    .feed-search-input {
      width: 100%;
      border: 1px solid #bcd8f5;
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 15px;
      background: #f7fbff;
      color: #1f4e7f;
      font-family: inherit;
    }
    .feed-search-btn {
      border-radius: 12px;
      padding: 11px 14px;
      white-space: nowrap;
    }
    .content-split {
      margin-top: 16px;
      display: grid;
      grid-template-columns: minmax(300px, 42%) minmax(0, 1fr);
      gap: 16px;
    }
    .feed-wrap {
      display: flex;
      flex-direction: column;
    }
    .feed-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #edf5ff;
      border: 1px solid #cfe1f4;
      border-radius: 12px 12px 0 0;
      color: #205689;
      font-weight: 700;
      flex-shrink: 0;
    }
    .feed-head-left {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .feed-hint {
      font-size: 12px;
      font-weight: 600;
      color: #4f7ea8;
    }
    .feed-carousel-shell {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      min-height: 450px;
      background: #fafdff;
      border: 1px solid #cfe1f4;
      border-top: 0;
      border-radius: 0 0 12px 12px;
      overflow: hidden;
    }
    .feed-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .feed-empty {
      color: #5a7ea1;
      font-size: 15px;
      text-align: center;
    }
    .feed-nav-btn {
      position: absolute;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #0f2f52;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: color 0.2s;
    }
    .feed-nav-btn:hover:not(:disabled) {
      color: #0a2139;
    }
    .feed-nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .feed-nav-btn.prev {
      left: 12px;
    }
    .feed-nav-btn.next {
      right: 12px;
    }
    .post-card {
      width: min(100%, 420px);
      max-width: 100%;
      background: #fff;
      border: 1px solid #d4e3f0;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .post-card:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 24px rgba(31, 95, 181, 0.18);
    }
    .post-card:active {
      transform: scale(0.98);
    }
    .post-image {
      width: 100%;
      height: 320px;
      object-fit: cover;
      background: #f0f5fa;
    }
    .post-image-wrap {
      position: relative;
      cursor: pointer;
    }
    .post-image-wrap .feed-nav-btn {
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
    }
    .post-image-wrap .feed-nav-btn.prev {
      left: 10px;
    }
    .post-image-wrap .feed-nav-btn.next {
      right: 10px;
    }
    .post-content {
      padding: 16px;
    }
    .post-title {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 800;
      color: #1e5488;
      line-height: 1.35;
      word-break: keep-all;
    }
    .post-category {
      display: inline-block;
      margin: 8px 0 0;
      padding: 4px 8px;
      background: #dfeeff;
      color: #1f5fb5;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }
    .post-address {
      margin: 8px 0 0;
      font-size: 13px;
      color: #38648d;
      line-height: 1.4;
      word-break: keep-all;
    }
    .post-detail {
      margin: 8px 0 0;
      font-size: 13px;
      color: #38648d;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: keep-all;
    }
    .post-actions {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .post-action-btn {
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: none;
      cursor: pointer;
      border: 0;
    }
    .post-heart-btn {
      border: 1px solid #bcd8f5;
      background: #f2f7ff;
      color: #4e6f9a;
    }
    .post-heart-btn.active {
      border-color: #8f73db;
      background: #efe9ff;
      color: #6a46cb;
    }
    .map-wrap {
      border: 1px solid #cfe1f4;
      border-radius: 12px;
      background: #f7fbff;
      overflow: hidden;
      min-height: 600px;
      display: flex;
    }
    .map-canvas {
      flex: 1;
      min-height: 100%;
    }
    .edit-modal {
      position: fixed;
      inset: 0;
      z-index: 1100;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .edit-modal[hidden] {
      display: none;
    }
    .edit-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(17, 47, 80, 0.4);
      backdrop-filter: blur(2px);
    }
    .edit-modal-panel {
      position: relative;
      width: min(680px, 100%);
      max-height: calc(100vh - 32px);
      border: 1px solid #bcd8f5;
      border-radius: 18px;
      background: rgba(247, 251, 255, 0.98);
      box-shadow: 0 16px 36px rgba(22, 74, 125, 0.24);
      padding: 20px;
      overflow: auto;
    }
    .edit-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .edit-modal-title {
      margin: 0;
      font-size: 28px;
      color: #1f5a95;
    }
    .edit-close-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      padding: 0;
      font-size: 24px;
      color: #2f628e;
      border: 1px solid #a9c7e8;
      background: #e6f0ff;
      box-shadow: none;
      line-height: 1;
      cursor: pointer;
    }
    .edit-grid {
      display: grid;
      gap: 12px;
    }
    .edit-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .edit-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .edit-grid input,
    .edit-grid select,
    .edit-grid textarea {
      width: 100%;
      border: 1px solid #bcd8f5;
      border-radius: 10px;
      padding: 10px 11px;
      font-size: 14px;
      background: #f7fbff;
      color: #1f4e7f;
      font-family: inherit;
    }
    .edit-grid textarea {
      min-height: 90px;
      resize: vertical;
    }
    .edit-mini-note {
      margin: 0;
      color: #4f7ea8;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .content-split {
        grid-template-columns: 1fr;
      }
      .combo-grid {
        grid-template-columns: 1fr;
      }
      .feed-grid {
        padding: 0;
      }
      .feed-carousel-shell {
        padding: 12px;
      }
      .feed-nav-btn {
        width: 36px;
        height: 36px;
        font-size: 34px;
      }
      .feed-nav-btn.prev {
        left: 8px;
      }
      .feed-nav-btn.next {
        right: 8px;
      }
      .post-card {
        width: min(86vw, 320px);
        flex-basis: min(86vw, 320px);
      }
      .edit-grid-2,
      .edit-grid-3 {
        grid-template-columns: 1fr;
      }
    }
    .modal-popup {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .modal-popup[hidden] {
      display: none;
    }
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(17, 47, 80, 0.4);
      backdrop-filter: blur(2px);
    }
    .modal-panel {
      position: relative;
      width: min(760px, 100%);
      max-height: calc(100vh - 32px);
      border: 1px solid #bcd8f5;
      border-radius: 18px;
      background: rgba(247, 251, 255, 0.98);
      box-shadow: 0 16px 36px rgba(22, 74, 125, 0.24);
      padding: 16px;
      overflow: auto;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .modal-title {
      margin: 0;
      font-size: 32px;
      color: #1f5a95;
      line-height: 1;
    }
    .modal-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .modal-close {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      padding: 0;
      font-size: 24px;
      color: #2f628e;
      border: 1px solid #a9c7e8;
      background: #e6f0ff;
      box-shadow: none;
      line-height: 1;
      cursor: pointer;
    }
    .modal-note {
      margin-top: 10px;
      color: #426f98;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>여행 피드</h1>
      <button id="feedOpenPickerBtn" type="button" class="page-link">장소등록 팝업 열기</button>
      <a class="page-link" href="/trip-info">여행 정보 입력하기</a>

      <div class="combo-grid">
        <div>
          <label for="feedCountry">국가 선택</label>
          <select id="feedCountry" required>
            <option value="">국가를 선택하세요</option>
            {% for country in initial_data.countries %}
            <option value="{{ country }}">{{ country }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label for="feedCity">도시 선택</label>
          <select id="feedCity" required>
            <option value="">도시를 선택하세요</option>
          </select>
        </div>
        <div>
          <label for="feedKeyword">단어 검색</label>
          <div class="feed-search-row">
            <input id="feedKeyword" class="feed-search-input" type="text" placeholder="관광지/상세 설명 검색" />
            <button id="feedSearchBtn" type="button" class="page-link feed-search-btn">검색</button>
          </div>
        </div>
      </div>

      <div class="content-split">
        <div class="feed-wrap">
          <div class="feed-head">
            <span class="feed-head-left">
              <span>주요 관광지</span>
              <span class="feed-hint">화살표로 한 칸씩 이동, 카드 더블클릭으로 수정</span>
            </span>
            <span id="feedSummary">0/0</span>
          </div>
          <div class="feed-carousel-shell">
            <div id="tripFeed" class="feed-grid">
              <div class="feed-empty">국가와 도시를 선택하면 여행 포스트가 표시됩니다.</div>
            </div>
          </div>
        </div>
        <div class="map-wrap">
          <div id="feedMap" class="map-canvas" role="region" aria-label="여행 피드 지도"></div>
        </div>
      </div>

      <p id="feedMapSummary" style="margin-top: 12px; color: #2f628e; font-size: 14px;"></p>
    </section>
  </main>

  <section id="feedEditModal" class="edit-modal" hidden>
    <div id="feedEditModalBackdrop" class="edit-modal-backdrop"></div>
    <div class="edit-modal-panel">
      <div class="edit-modal-head">
        <p class="edit-modal-title">여행 포스트 수정</p>
        <div style="display: flex; gap: 8px;">
          <button id="feedEditSaveBtn" type="button">저장</button>
          <button id="feedEditCloseBtn" type="button" class="edit-close-btn" aria-label="닫기">×</button>
        </div>
      </div>
      <div class="edit-grid">
        <p class="edit-mini-note">국가/도시는 유지하고, 장소 정보만 수정합니다.</p>
        <div>
          <label for="feedEditAttraction">관광지명</label>
          <input id="feedEditAttraction" />
        </div>
        <div class="edit-grid-3">
          <div>
            <label for="feedEditCategory">구분</label>
            <select id="feedEditCategory">
              <option value="">구분 선택</option>
              <option value="랜드마크">랜드마크</option>
              <option value="박물관">박물관</option>
              <option value="음식점">음식점</option>
              <option value="숙소">숙소</option>
              <option value="공원">공원</option>
            </select>
          </div>
          <div>
            <label for="feedEditLatitude">위도</label>
            <input id="feedEditLatitude" type="number" step="0.0001" />
          </div>
          <div>
            <label for="feedEditLongitude">경도</label>
            <input id="feedEditLongitude" type="number" step="0.0001" />
          </div>
        </div>
        <div>
          <label for="feedEditAddress">주소</label>
          <input id="feedEditAddress" />
        </div>
        <div>
          <label for="feedEditImageUrl">이미지 URL</label>
          <input id="feedEditImageUrl" />
        </div>
        <div>
          <label for="feedEditDetail">상세 설명</label>
          <textarea id="feedEditDetail"></textarea>
        </div>
      </div>
    </div>
  </section>

  <section id="feedPickerModal" class="modal-popup" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-panel">
      <div class="modal-head">
        <p class="modal-title">여행 장소등록</p>
        <div class="modal-actions">
          <button id="feedPickerSaveBtn" type="button" class="page-link" style="box-shadow: none;">저장</button>
          <button id="feedPickerCloseBtn" type="button" class="modal-close" aria-label="닫기">×</button>
        </div>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px;">
        <button id="feedPickerParseBtn" type="button" class="page-link" style="display: inline-flex; padding: 10px 16px; text-decoration: none; border-radius: 10px; border: 0;">파싱하기</button>
        <button id="feedPickerGoogleBtn" type="button" class="page-link" style="display: inline-flex; padding: 10px 16px; text-decoration: none; border-radius: 10px; border: 0;">구글API</button>
      </div>
      <p id="feedPickerNote" class="modal-note">시작 방식을 선택하세요.</p>
      <div id="feedPickerParseSection" style="display: none; border: 1px solid #bcd8f5; border-radius: 12px; padding: 12px; background: rgba(240, 247, 255, 0.65);">
        <div class="edit-grid">
          <div>
            <label for="feedPickerParseMapsUrl">구글맵스 링크</label>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
              <input id="feedPickerParseMapsUrl" placeholder="https://maps.google.com/..." style="flex: 1 1 360px;" />
              <button id="runFeedPickerParseBtn" type="button" class="page-link" style="border: 0;">링크 파싱</button>
            </div>
          </div>
          <div class="edit-grid-3">
            <div>
              <label for="feedPickerParseCountry">국가</label>
              <input id="feedPickerParseCountry" placeholder="예: 그리스" />
            </div>
            <div>
              <label for="feedPickerParseCity">도시</label>
              <input id="feedPickerParseCity" placeholder="예: 아테네" />
            </div>
            <div>
              <label for="feedPickerParseCategory">카테고리</label>
              <select id="feedPickerParseCategory">
                <option value="관광지">관광지</option>
                <option value="랜드마크">랜드마크</option>
                <option value="맛집">맛집</option>
                <option value="카페">카페</option>
                <option value="숙소">숙소</option>
                <option value="기타">기타</option>
              </select>
            </div>
          </div>
          <div>
            <label for="feedPickerParseAttraction">관광지명</label>
            <input id="feedPickerParseAttraction" placeholder="파싱 후 자동 입력됩니다." />
          </div>
          <div>
            <label for="feedPickerParseAddress">주소</label>
            <input id="feedPickerParseAddress" placeholder="가능하면 자동 입력됩니다." />
          </div>
          <div class="edit-grid-3">
            <div>
              <label for="feedPickerParseLatitude">위도</label>
              <input id="feedPickerParseLatitude" type="number" step="0.000001" />
            </div>
            <div>
              <label for="feedPickerParseLongitude">경도</label>
              <input id="feedPickerParseLongitude" type="number" step="0.000001" />
            </div>
            <div>
              <label for="feedPickerParseImageUrl">이미지 URL</label>
              <input id="feedPickerParseImageUrl" placeholder="가능하면 자동 입력됩니다." />
            </div>
          </div>
          <div id="feedPickerParseStatus" class="edit-mini-note">구글맵스 링크를 붙여넣고 링크 파싱을 누르세요.</div>
        </div>
      </div>
      <div id="feedPickerGoogleSection" style="display: none; border: 1px solid #bcd8f5; border-radius: 12px; padding: 12px; background: rgba(240, 247, 255, 0.65);">
        <div class="edit-grid-3">
          <div>
            <label for="feedPickerGoogleCountry">국가 선택</label>
            <select id="feedPickerGoogleCountry">
              <option value="">국가를 선택하세요</option>
              <option value="KR">대한민국 (KR)</option>
              <option value="US">미국 (US)</option>
              <option value="GB">영국 (GB)</option>
              <option value="FR">프랑스 (FR)</option>
              <option value="JP">일본 (JP)</option>
              <option value="IT">이탈리아 (IT)</option>
              <option value="ES">스페인 (ES)</option>
              <option value="DE">독일 (DE)</option>
              <option value="CZ">체코 (CZ)</option>
              <option value="HU">헝가리 (HU)</option>
              <option value="PL">폴란드 (PL)</option>
              <option value="TR">터키 (TR)</option>
              <option value="SG">싱가포르 (SG)</option>
              <option value="MY">말레이시아 (MY)</option>
              <option value="HK">홍콩 (HK)</option>
              <option value="MO">마카오 (MO)</option>
              <option value="CN">중국 (CN)</option>
            </select>
          </div>
          <div>
            <label for="feedPickerGoogleCountryCustom">국가 직접 입력</label>
            <input id="feedPickerGoogleCountryCustom" placeholder="예: 그리스" />
          </div>
          <div>
            <label for="feedPickerGoogleCountryCodeCustom">국가코드 직접 입력</label>
            <input id="feedPickerGoogleCountryCodeCustom" placeholder="예: GR" maxlength="2" />
          </div>
          <div>
            <label for="feedPickerGoogleCity">도시 선택</label>
            <select id="feedPickerGoogleCity">
              <option value="">도시를 선택하세요</option>
            </select>
          </div>
          <div>
            <label for="feedPickerGoogleCityCustom">도시 직접 입력</label>
            <input id="feedPickerGoogleCityCustom" placeholder="예: 샌프란시스코" />
          </div>
          <div>
            <label for="feedPickerGoogleCategory">카테고리 선택</label>
            <select id="feedPickerGoogleCategory">
              <option value="">카테고리를 선택하세요</option>
              <option value="tourist_attraction">관광명소</option>
              <option value="historical_landmark">랜드마크</option>
              <option value="museum">박물관</option>
              <option value="park">공원</option>
              <option value="lodging">호텔/숙소</option>
              <option value="restaurant">식당</option>
              <option value="cafe">카페</option>
            </select>
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
          <button id="runFeedPickerGoogleSearchBtn" type="button" class="page-link" style="border: 0;">검색</button>
        </div>

        <div style="margin-top: 10px; border: 1px solid #bcd8f5; border-radius: 12px; overflow: hidden;">
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #e8f2ff; color: #215689; font-weight: 700;">
            <span>검색 피드</span>
            <div style="display: inline-flex; align-items: center; gap: 10px;">
              <label for="feedPickerSelectAllCheckbox" style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; margin: 0; font-weight: 700; cursor: pointer;">
                <input id="feedPickerSelectAllCheckbox" type="checkbox" />
                전체 선택
              </label>
              <span id="feedPickerFeedSummary">0건</span>
            </div>
          </div>
          <div id="feedPickerFeedGrid" style="padding: 12px; display: grid; gap: 10px; max-height: 280px; overflow: auto; background: rgba(250, 253, 255, 0.8);">
            <div style="border: 1px dashed #a8c8ee; border-radius: 12px; color: #5278a1; padding: 16px; text-align: center;">검색 결과가 여기에 표시됩니다.</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // 모달 팝업 제어
    const feedOpenPickerBtn = document.getElementById('feedOpenPickerBtn');
    const feedPickerModal = document.getElementById('feedPickerModal');
    const feedPickerCloseBtn = document.getElementById('feedPickerCloseBtn');
    const feedPickerBackdrop = feedPickerModal.querySelector('.modal-backdrop');
    const feedPickerSaveBtnEl = document.getElementById('feedPickerSaveBtn');
    const feedPickerParseBtnEl = document.getElementById('feedPickerParseBtn');
    const feedPickerGoogleBtnEl = document.getElementById('feedPickerGoogleBtn');
    const feedPickerNoteEl = document.getElementById('feedPickerNote');
    const feedPickerParseSectionEl = document.getElementById('feedPickerParseSection');
    const feedPickerParseMapsUrlEl = document.getElementById('feedPickerParseMapsUrl');
    const runFeedPickerParseBtnEl = document.getElementById('runFeedPickerParseBtn');
    const feedPickerParseCountryEl = document.getElementById('feedPickerParseCountry');
    const feedPickerParseCityEl = document.getElementById('feedPickerParseCity');
    const feedPickerParseCategoryEl = document.getElementById('feedPickerParseCategory');
    const feedPickerParseAttractionEl = document.getElementById('feedPickerParseAttraction');
    const feedPickerParseAddressEl = document.getElementById('feedPickerParseAddress');
    const feedPickerParseLatitudeEl = document.getElementById('feedPickerParseLatitude');
    const feedPickerParseLongitudeEl = document.getElementById('feedPickerParseLongitude');
    const feedPickerParseImageUrlEl = document.getElementById('feedPickerParseImageUrl');
    const feedPickerParseStatusEl = document.getElementById('feedPickerParseStatus');
    const feedPickerGoogleSectionEl = document.getElementById('feedPickerGoogleSection');
    const feedPickerGoogleCountryEl = document.getElementById('feedPickerGoogleCountry');
    const feedPickerGoogleCountryCustomEl = document.getElementById('feedPickerGoogleCountryCustom');
    const feedPickerGoogleCountryCodeCustomEl = document.getElementById('feedPickerGoogleCountryCodeCustom');
    const feedPickerGoogleCityEl = document.getElementById('feedPickerGoogleCity');
    const feedPickerGoogleCityCustomEl = document.getElementById('feedPickerGoogleCityCustom');
    const feedPickerGoogleCategoryEl = document.getElementById('feedPickerGoogleCategory');
    const runFeedPickerGoogleSearchBtnEl = document.getElementById('runFeedPickerGoogleSearchBtn');
    const feedPickerSelectAllCheckboxEl = document.getElementById('feedPickerSelectAllCheckbox');
    const feedPickerFeedSummaryEl = document.getElementById('feedPickerFeedSummary');
    const feedPickerFeedGridEl = document.getElementById('feedPickerFeedGrid');

    const FEED_PICKER_CITY_OPTIONS = {
      KR: ['서울', '부산', '인천'],
      US: ['보스턴', '뉴욕', '로스앤젤레스'],
      GB: ['런던'],
      FR: ['파리'],
      JP: ['도쿄', '오사카'],
      IT: ['로마'],
      ES: ['바르셀로나'],
      DE: ['베를린'],
      CZ: ['프라하'],
      HU: ['부다페스트'],
      PL: ['바르샤바'],
      TR: ['이스탄불'],
      SG: ['싱가포르'],
      MY: ['쿠알라룸푸르'],
      HK: ['홍콩'],
      MO: ['마카오'],
      CN: ['상해'],
    };

    let feedPickerPlaces = [];
    const selectedFeedPickerIndexes = new Set();
  let feedPickerMode = '';

    function updateFeedPickerGoogleCities() {
      const code = feedPickerGoogleCountryEl.value || '';
      const cities = FEED_PICKER_CITY_OPTIONS[code] || [];
      const previous = feedPickerGoogleCityEl.value;
      feedPickerGoogleCityEl.innerHTML = '<option value="">도시를 선택하세요</option>';
      cities.forEach((city) => {
        const opt = document.createElement('option');
        opt.value = city;
        opt.textContent = city;
        feedPickerGoogleCityEl.appendChild(opt);
      });
      if (cities.includes(previous)) {
        feedPickerGoogleCityEl.value = previous;
      }
    }

    function getFeedPickerCategoryKeyword(categoryValue) {
      const categoryKeywordMap = {
        tourist_attraction: '관광 명소',
        historical_landmark: '랜드마크',
        lodging: '호텔',
        restaurant: '레스토랑',
        cafe: '카페',
        museum: '박물관',
        park: '공원',
      };
      return categoryKeywordMap[String(categoryValue || '').trim().toLowerCase()] || '관광 명소';
    }

    function mapFeedPickerCategoryToLocation(categoryValue) {
      const categoryMap = {
        tourist_attraction: '관광지',
        historical_landmark: '랜드마크',
        museum: '관광지',
        park: '관광지',
        lodging: '숙소',
        restaurant: '맛집',
        cafe: '카페',
      };
      return categoryMap[String(categoryValue || '').trim().toLowerCase()] || '기타';
    }

    function getFeedPickerPlaceName(place) {
      if (!place) {
        return '';
      }
      if (typeof place.displayName === 'object') {
        return String(place.displayName?.text || '').trim();
      }
      return String(place.displayName || '').trim();
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function syncFeedPickerSelectAllCheckbox() {
      const totalCount = Array.isArray(feedPickerPlaces) ? feedPickerPlaces.length : 0;
      if (totalCount === 0) {
        feedPickerSelectAllCheckboxEl.checked = false;
        feedPickerSelectAllCheckboxEl.indeterminate = false;
        feedPickerSelectAllCheckboxEl.disabled = true;
        return;
      }

      const selectedCount = selectedFeedPickerIndexes.size;
      feedPickerSelectAllCheckboxEl.disabled = false;
      feedPickerSelectAllCheckboxEl.checked = selectedCount === totalCount;
      feedPickerSelectAllCheckboxEl.indeterminate = selectedCount > 0 && selectedCount < totalCount;
    }

    function renderFeedPickerFeed() {
      if (!Array.isArray(feedPickerPlaces) || !feedPickerPlaces.length) {
        feedPickerFeedGridEl.innerHTML = '<div style="border: 1px dashed #a8c8ee; border-radius: 12px; color: #5278a1; padding: 16px; text-align: center;">검색 결과가 여기에 표시됩니다.</div>';
        feedPickerFeedSummaryEl.textContent = '0건';
        syncFeedPickerSelectAllCheckbox();
        return;
      }

      const cards = feedPickerPlaces.map((place, index) => {
        const selected = selectedFeedPickerIndexes.has(index);
        const name = escapeHtml(getFeedPickerPlaceName(place) || '이름 없음');
        const address = escapeHtml(place.formattedAddress || '-');
        const photoUrl = place.photoUrl ? escapeHtml(place.photoUrl) : '';
        const btnText = selected ? '선택됨' : '선택';
        const btnStyle = selected
          ? 'background:#2b6ec7;color:#fff;border:0;'
          : 'background:#e9f2ff;color:#1f5fb5;border:1px solid #bcd8f5;';

        return `
          <article style="display:grid;grid-template-columns:100px 1fr;gap:10px;border:1px solid #cfe1f4;border-radius:10px;padding:10px;background:#fff;">
            ${photoUrl ? `<img src="${photoUrl}" alt="${name}" style="width:100px;height:74px;object-fit:cover;border-radius:8px;background:#f0f5fa;" />` : '<div style="width:100px;height:74px;border-radius:8px;background:#eef4fb;"></div>'}
            <div>
              <p style="margin:0;font-weight:800;color:#1e5488;">${name}</p>
              <p style="margin:6px 0 0;color:#38648d;font-size:13px;">${address}</p>
              <div style="margin-top:8px;display:flex;justify-content:flex-end;">
                <button type="button" data-feed-picker-index="${index}" style="border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;${btnStyle}">${btnText}</button>
              </div>
            </div>
          </article>
        `;
      });

      feedPickerFeedGridEl.innerHTML = cards.join('');
      feedPickerFeedSummaryEl.textContent = `${feedPickerPlaces.length}건`;
      syncFeedPickerSelectAllCheckbox();
    }

    async function runFeedPickerGoogleSearch() {
      const selectedCountryCode = feedPickerGoogleCountryEl.value.trim().toUpperCase();
      const customCountryName = feedPickerGoogleCountryCustomEl.value.trim();
      const customCountryCode = feedPickerGoogleCountryCodeCustomEl.value.trim().toUpperCase();
      const countryCodeRaw = customCountryCode || selectedCountryCode;
      const countryCode = /^[A-Z]{2}$/.test(countryCodeRaw) ? countryCodeRaw : '';
      const city = (feedPickerGoogleCityCustomEl.value || feedPickerGoogleCityEl.value || '').trim();
      const category = feedPickerGoogleCategoryEl.value.trim();
      if ((!countryCode && !customCountryName) || !city || !category) {
        feedPickerNoteEl.textContent = '국가(선택/직접입력), 도시(선택/직접입력), 카테고리를 모두 지정하세요.';
        return;
      }

      const keyword = getFeedPickerCategoryKeyword(category);
      feedPickerNoteEl.textContent = 'Google API 검색 중...';
      runFeedPickerGoogleSearchBtnEl.disabled = true;

      try {
        const res = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: `${city} ${customCountryName || ''} ${keyword}`.trim(),
            search_type: 'text',
            country_code: countryCode,
            place_category: category,
            max_pages: 1,
          }),
        });

        const payload = await res.json();
        if (!res.ok) {
          throw new Error(payload.error || 'Google 검색 실패');
        }

        feedPickerPlaces = Array.isArray(payload.places) ? payload.places : [];
        selectedFeedPickerIndexes.clear();
        renderFeedPickerFeed();
        feedPickerNoteEl.textContent = feedPickerPlaces.length
          ? `검색 결과 ${feedPickerPlaces.length}건. 저장 버튼으로 선택 항목을 등록하세요.`
          : '검색 결과가 없습니다.';
      } catch (error) {
        console.error(error);
        feedPickerNoteEl.textContent = `Google 검색 실패: ${error.message}`;
      } finally {
        runFeedPickerGoogleSearchBtnEl.disabled = false;
      }
    }

    function handleFeedPickerFeedClick(event) {
      const btn = event.target.closest('button[data-feed-picker-index]');
      if (!btn) {
        return;
      }

      const index = Number(btn.getAttribute('data-feed-picker-index'));
      if (!Number.isFinite(index)) {
        return;
      }

      if (selectedFeedPickerIndexes.has(index)) {
        selectedFeedPickerIndexes.delete(index);
      } else {
        selectedFeedPickerIndexes.add(index);
      }
      renderFeedPickerFeed();
    }

    function handleFeedPickerSelectAllChange(event) {
      const checked = Boolean(event.target?.checked);
      selectedFeedPickerIndexes.clear();
      if (checked) {
        feedPickerPlaces.forEach((_, index) => selectedFeedPickerIndexes.add(index));
      }
      renderFeedPickerFeed();
    }

    async function saveFeedPickerSelected() {
      const selected = Array.from(selectedFeedPickerIndexes)
        .map((idx) => feedPickerPlaces[idx])
        .filter(Boolean);

      if (!selected.length) {
        feedPickerNoteEl.textContent = '저장할 장소를 먼저 선택하세요.';
        return;
      }

      const selectedCountryOpt = feedPickerGoogleCountryEl.options[feedPickerGoogleCountryEl.selectedIndex];
      const selectedCountryText = String(selectedCountryOpt?.textContent || '').trim().replace(/\s*\([A-Z]{2}\)\s*$/, '');
      const countryText = feedPickerGoogleCountryCustomEl.value.trim() || selectedCountryText || feedPickerGoogleCountryCodeCustomEl.value.trim().toUpperCase();
      const city = (feedPickerGoogleCityCustomEl.value || feedPickerGoogleCityEl.value || '').trim();
      const category = mapFeedPickerCategoryToLocation(feedPickerGoogleCategoryEl.value);

      if (!countryText || !city) {
        feedPickerNoteEl.textContent = '국가와 도시(선택 또는 직접입력)를 지정한 뒤 저장하세요.';
        return;
      }

      feedPickerSaveBtnEl.disabled = true;
      feedPickerNoteEl.textContent = `선택 ${selected.length}건 저장 중...`;

      let saved = 0;
      let duplicated = 0;
      try {
        for (const place of selected) {
          const payload = {
            country: countryText,
            city,
            attraction: getFeedPickerPlaceName(place) || '이름 없음',
            detail: '',
            image_url: place.photoUrl || '',
            maps_url: place.googleMapsUri || '',
            address: place.formattedAddress || '',
            latitude: place.latitude,
            longitude: place.longitude,
            category,
          };

          const res = await fetch('/api/location-info', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.error || 'LocationInfo 저장 실패');
          }
          if (data.duplicate) {
            duplicated += 1;
          } else {
            saved += 1;
          }
        }

        feedPickerNoteEl.textContent = `LocationInfo 저장 완료: 신규 ${saved}건, 중복 ${duplicated}건`;
        await loadComboOptions();
        if (countryText) {
          feedCountryEl.value = countryText;
          updateCityOptions();
        }
        if (city) {
          feedCityEl.value = city;
        }
        await loadFeedByLocation();
      } catch (error) {
        console.error(error);
        feedPickerNoteEl.textContent = `저장 실패: ${error.message}`;
      } finally {
        feedPickerSaveBtnEl.disabled = false;
      }
    }

    async function reverseGeocodeFeedPicker(lat, lng) {
      if (lat === '' || lng === '' || lat == null || lng == null) {
        return '';
      }

      try {
        const endpoint = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}`;
        const response = await fetch(endpoint, {
          headers: { Accept: 'application/json' }
        });
        if (!response.ok) {
          return '';
        }
        const payload = await response.json();
        return String(payload?.display_name || '').trim();
      } catch {
        return '';
      }
    }

    async function runFeedPickerParse() {
      const mapsUrl = feedPickerParseMapsUrlEl.value.trim();
      if (!mapsUrl) {
        feedPickerParseStatusEl.textContent = '구글맵스 링크를 먼저 입력하세요.';
        feedPickerParseMapsUrlEl.focus();
        return;
      }

      runFeedPickerParseBtnEl.disabled = true;
      feedPickerParseStatusEl.textContent = '링크 파싱 중...';

      try {
        const res = await fetch('/api/maps-resolve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ maps_url: mapsUrl }),
        });
        const payload = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(payload.error || '링크 파싱 실패');
        }

        if (payload.final_url) {
          feedPickerParseMapsUrlEl.value = String(payload.final_url);
        }
        if (payload.place_name && !feedPickerParseAttractionEl.value.trim()) {
          feedPickerParseAttractionEl.value = String(payload.place_name).trim();
        }
        if (payload.latitude != null) {
          feedPickerParseLatitudeEl.value = String(payload.latitude);
        }
        if (payload.longitude != null) {
          feedPickerParseLongitudeEl.value = String(payload.longitude);
        }
        if (payload.photo_url) {
          feedPickerParseImageUrlEl.value = String(payload.photo_url).trim();
        }

        if (!feedPickerParseAddressEl.value.trim() && payload.latitude != null && payload.longitude != null) {
          const derivedAddress = await reverseGeocodeFeedPicker(payload.latitude, payload.longitude);
          if (derivedAddress) {
            feedPickerParseAddressEl.value = derivedAddress;
          }
        }

        feedPickerParseStatusEl.textContent = payload.latitude != null && payload.longitude != null
          ? '파싱 완료. 관광지명/좌표를 채웠습니다. 필요한 값 확인 후 저장하세요.'
          : '파싱 완료. 링크에서 이름만 찾았습니다. 나머지 값은 직접 보완 후 저장하세요.';
      } catch (error) {
        console.error(error);
        feedPickerParseStatusEl.textContent = `파싱 실패: ${error.message}`;
      } finally {
        runFeedPickerParseBtnEl.disabled = false;
      }
    }

    async function saveFeedPickerParsedItem() {
      const country = feedPickerParseCountryEl.value.trim();
      const city = feedPickerParseCityEl.value.trim();
      const attraction = feedPickerParseAttractionEl.value.trim();
      const latitude = feedPickerParseLatitudeEl.value.trim();
      const longitude = feedPickerParseLongitudeEl.value.trim();

      if (!country || !city || !attraction) {
        feedPickerParseStatusEl.textContent = '국가, 도시, 관광지명은 입력해야 저장할 수 있습니다.';
        return;
      }

      feedPickerSaveBtnEl.disabled = true;
      feedPickerParseStatusEl.textContent = '파싱 결과 저장 중...';

      try {
        const res = await fetch('/api/location-info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            country,
            city,
            attraction,
            detail: '',
            image_url: feedPickerParseImageUrlEl.value.trim(),
            maps_url: feedPickerParseMapsUrlEl.value.trim(),
            address: feedPickerParseAddressEl.value.trim(),
            latitude,
            longitude,
            category: feedPickerParseCategoryEl.value.trim(),
          }),
        });
        const payload = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(payload.error || 'LocationInfo 저장 실패');
        }

        feedPickerParseStatusEl.textContent = '저장 완료. 방금 파싱한 장소가 등록되었습니다.';
        feedPickerNoteEl.textContent = '파싱 저장이 완료되었습니다.';
        await loadComboOptions();
        if (Array.isArray(cityOptions[country]) && cityOptions[country].includes(city)) {
          feedCountryEl.value = country;
          updateCityOptions();
          feedCityEl.value = city;
          await loadFeedByLocation();
        }
      } catch (error) {
        console.error(error);
        feedPickerParseStatusEl.textContent = `저장 실패: ${error.message}`;
      } finally {
        feedPickerSaveBtnEl.disabled = false;
      }
    }

    async function handleFeedPickerSave() {
      if (feedPickerMode === 'parse') {
        await saveFeedPickerParsedItem();
        return;
      }
      await saveFeedPickerSelected();
    }

    feedOpenPickerBtn.addEventListener('click', () => {
      feedPickerMode = '';
      feedPickerParseSectionEl.style.display = 'none';
      feedPickerGoogleSectionEl.style.display = 'none';
      feedPickerPlaces = [];
      selectedFeedPickerIndexes.clear();
      renderFeedPickerFeed();
      feedPickerNoteEl.textContent = '시작 방식을 선택하세요.';
      feedPickerParseStatusEl.textContent = '구글맵스 링크를 붙여넣고 링크 파싱을 누르세요.';
      feedPickerParseMapsUrlEl.value = '';
      feedPickerParseCountryEl.value = feedCountryEl.value || '';
      feedPickerParseCityEl.value = feedCityEl.value || '';
      feedPickerParseCategoryEl.value = '관광지';
      feedPickerParseAttractionEl.value = '';
      feedPickerParseAddressEl.value = '';
      feedPickerParseLatitudeEl.value = '';
      feedPickerParseLongitudeEl.value = '';
      feedPickerParseImageUrlEl.value = '';
      feedPickerModal.hidden = false;
    });

    feedPickerCloseBtn.addEventListener('click', () => {
      feedPickerModal.hidden = true;
    });

    feedPickerBackdrop.addEventListener('click', () => {
      feedPickerModal.hidden = true;
    });
    feedPickerSaveBtnEl.addEventListener('click', handleFeedPickerSave);
    feedPickerParseBtnEl.addEventListener('click', () => {
      feedPickerMode = 'parse';
      feedPickerParseSectionEl.style.display = 'block';
      feedPickerGoogleSectionEl.style.display = 'none';
      feedPickerParseCountryEl.value = feedPickerParseCountryEl.value || feedCountryEl.value || '';
      feedPickerParseCityEl.value = feedPickerParseCityEl.value || feedCityEl.value || '';
      feedPickerParseMapsUrlEl.focus();
      feedPickerNoteEl.textContent = '구글맵스 링크를 붙여넣고 링크 파싱 후 저장하세요.';
    });
    feedPickerGoogleBtnEl.addEventListener('click', () => {
      feedPickerMode = 'google';
      feedPickerParseSectionEl.style.display = 'none';
      feedPickerGoogleSectionEl.style.display = 'block';
      if (!feedPickerGoogleCountryEl.value) {
        feedPickerGoogleCountryEl.value = 'US';
      }
      if (!feedPickerGoogleCategoryEl.value) {
        feedPickerGoogleCategoryEl.value = 'tourist_attraction';
      }
      updateFeedPickerGoogleCities();
      feedPickerNoteEl.textContent = '국가/도시를 선택하거나 직접 입력한 뒤 검색을 누르세요.';
    });
    runFeedPickerParseBtnEl.addEventListener('click', runFeedPickerParse);
    feedPickerGoogleCountryEl.addEventListener('change', updateFeedPickerGoogleCities);
    runFeedPickerGoogleSearchBtnEl.addEventListener('click', runFeedPickerGoogleSearch);
    feedPickerFeedGridEl.addEventListener('click', handleFeedPickerFeedClick);
    feedPickerSelectAllCheckboxEl.addEventListener('change', handleFeedPickerSelectAllChange);

    // 기존 trip_feed.js 코드 (원래 있던 모든 코드)
    let currentFeedItems = [];
    let currentFeedIndex = 0;
    let editingItemId = null;
    let feedMap = null;
    let feedMarkersLayer = null;
    let feedMarkersById = new Map();
    let cityOptions = {{ initial_data.cities_by_country | tojson }} || {};

    const markerIconDefault = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const markerIconActive = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const markerIconSelected = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    let lastActiveMarkerId = null;
    const selectedHeartIds = new Set();

    const feedCountryEl = document.getElementById('feedCountry');
    const feedCityEl = document.getElementById('feedCity');
    const feedKeywordEl = document.getElementById('feedKeyword');
    const feedSearchBtnEl = document.getElementById('feedSearchBtn');
    const tripFeedEl = document.getElementById('tripFeed');
    const feedSummaryEl = document.getElementById('feedSummary');
    const feedMapSummaryEl = document.getElementById('feedMapSummary');
    const feedEditModalEl = document.getElementById('feedEditModal');
    const feedEditModalBackdropEl = document.getElementById('feedEditModalBackdrop');
    const feedEditAttractionEl = document.getElementById('feedEditAttraction');
    const feedEditCategoryEl = document.getElementById('feedEditCategory');
    const feedEditLatitudeEl = document.getElementById('feedEditLatitude');
    const feedEditLongitudeEl = document.getElementById('feedEditLongitude');
    const feedEditAddressEl = document.getElementById('feedEditAddress');
    const feedEditImageUrlEl = document.getElementById('feedEditImageUrl');
    const feedEditDetailEl = document.getElementById('feedEditDetail');
    const feedEditSaveBtnEl = document.getElementById('feedEditSaveBtn');
    const feedEditCloseBtnEl = document.getElementById('feedEditCloseBtn');

    function renderFeedCard(item) {
      const itemId = parseItemId(item.id);
      const isHeartSelected = itemId !== null && selectedHeartIds.has(itemId);
      const imageHtml = item.image_url ? `<img src="${item.image_url}" alt="${item.attraction_name}" class="post-image" />` : `<div class="post-image" style="background: linear-gradient(135deg, #e9f2ff, #dfeeff); display: flex; align-items: center; justify-content: center; color: #5a7ea1;">이미지 없음</div>`;
      const disablePrevAttr = currentFeedIndex === 0 ? 'disabled' : '';
      const disableNextAttr = currentFeedIndex === currentFeedItems.length - 1 ? 'disabled' : '';
      const detailText = (item.detail || '').trim() || '상세 설명이 없습니다.';
      return `
        <div class="post-card" data-id="${item.id}" role="button" tabindex="0">
          <div class="post-image-wrap">
            ${imageHtml}
            <button type="button" class="feed-nav-btn prev" data-step="-1" aria-label="이전 포스트" ${disablePrevAttr}>‹</button>
            <button type="button" class="feed-nav-btn next" data-step="1" aria-label="다음 포스트" ${disableNextAttr}>›</button>
          </div>
          <div class="post-content">
            <div class="post-title">${item.attraction_name}</div>
            <div class="post-detail">${detailText}</div>
            <div class="post-actions">
              <button type="button" class="post-action-btn post-heart-btn ${isHeartSelected ? 'active' : ''}" data-heart-id="${item.id}" aria-label="하트 선택">${isHeartSelected ? '❤' : '♡'}</button>
              <button type="button" class="page-link post-action-btn">지도보기</button>
            </div>
          </div>
        </div>
      `;
    }

    function updateMarkerIcons() {
      feedMarkersById.forEach((marker, rawId) => {
        const markerId = parseItemId(rawId);
        if (markerId !== null && selectedHeartIds.has(markerId)) {
          marker.setIcon(markerIconSelected);
        } else if (lastActiveMarkerId !== null && markerId === lastActiveMarkerId) {
          marker.setIcon(markerIconActive);
        } else {
          marker.setIcon(markerIconDefault);
        }
      });
    }

    function toggleHeart(itemId) {
      const parsedId = parseItemId(itemId);
      if (parsedId === null) {
        return;
      }
      const willSelect = !selectedHeartIds.has(parsedId);
      if (selectedHeartIds.has(parsedId)) {
        selectedHeartIds.delete(parsedId);
      } else {
        selectedHeartIds.add(parsedId);
      }
      syncFeedNavState();
      updateMarkerIcons();
      persistHeartSelection(parsedId, willSelect);
    }

    async function persistHeartSelection(itemId, selected) {
      try {
        const res = await fetch('/api/location-info/favorites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: itemId, selected }),
        });
        const payload = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(payload.error || '하트 저장 실패');
        }
      } catch (error) {
        console.error(error);
        if (selected) {
          selectedHeartIds.delete(itemId);
        } else {
          selectedHeartIds.add(itemId);
        }
        syncFeedNavState();
        updateMarkerIcons();
      }
    }

    async function loadHeartSelections(itemIds) {
      selectedHeartIds.clear();
      if (!Array.isArray(itemIds) || itemIds.length === 0) {
        return;
      }

      const idsParam = itemIds.join(',');
      try {
        const res = await fetch(`/api/location-info/favorites?ids=${encodeURIComponent(idsParam)}`, { cache: 'no-store' });
        const payload = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(payload.error || '하트 목록 조회 실패');
        }

        const favoriteIds = Array.isArray(payload.favorite_ids) ? payload.favorite_ids : [];
        favoriteIds.forEach((idValue) => {
          const parsed = parseItemId(idValue);
          if (parsed !== null) {
            selectedHeartIds.add(parsed);
          }
        });
      } catch (error) {
        console.error(error);
      }
    }

    function moveFeedCard(step) {
      const newIndex = currentFeedIndex + step;
      if (newIndex >= 0 && newIndex < currentFeedItems.length) {
        currentFeedIndex = newIndex;
        syncFeedNavState();
        syncMapMarkerToCurrentCard();
      }
    }

    function moveFeedCardToItemId(itemId) {
      const index = currentFeedItems.findIndex(item => item.id === itemId);
      if (index !== -1) {
        currentFeedIndex = index;
        syncFeedNavState();
        syncMapMarkerToCurrentCard();
      }
    }

    function syncFeedNavState() {
      tripFeedEl.innerHTML = currentFeedItems.length ? renderFeedCard(currentFeedItems[currentFeedIndex]) : '<div class="feed-empty">포스트가 없습니다.</div>';
      if (currentFeedItems.length === 0) {
        feedSummaryEl.textContent = '0/0';
      } else {
        feedSummaryEl.textContent = `${currentFeedIndex + 1}/${currentFeedItems.length}`;
      }
      const postCard = tripFeedEl.querySelector('.post-card');
      if (postCard) {
        const navButtons = postCard.querySelectorAll('.feed-nav-btn[data-step]');
        navButtons.forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            const step = parseInt(button.getAttribute('data-step') || '0', 10);
            if (!Number.isNaN(step) && step !== 0) {
              moveFeedCard(step);
            }
          });
        });
        const imageWrap = postCard.querySelector('.post-image-wrap');
        if (imageWrap) {
          imageWrap.addEventListener('click', (event) => {
            event.stopPropagation();
            const rect = imageWrap.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const isRightHalf = clickX >= rect.width / 2;
            moveFeedCard(isRightHalf ? 1 : -1);
          });
        }
        postCard.addEventListener('dblclick', () => openEditModal(currentFeedItems[currentFeedIndex]));
        const mapLink = postCard.querySelector('.post-action-btn.page-link');
        const heartBtn = postCard.querySelector('.post-heart-btn');
        if (mapLink) {
          mapLink.addEventListener('click', (event) => {
            event.stopPropagation();
            syncMapMarkerToCurrentCard();
          });
        }
        if (heartBtn) {
          heartBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            toggleHeart(heartBtn.getAttribute('data-heart-id'));
          });
        }
        postCard.addEventListener('click', (event) => {
          if (event.target.closest('button')) {
            return;
          }
          if (mapLink) {
            mapLink.click();
          }
        });
      }
    }

    function renderFeedMap(items) {
      if (!feedMap) {
        ensureFeedMap();
      }
      feedMarkersLayer.clearLayers();
      feedMarkersById.clear();
      lastActiveMarkerId = null;
      const bounds = [];
      items.forEach((point) => {
        const lat = parseCoordinate(point.latitude);
        const lng = parseCoordinate(point.longitude);
        if (lat === null || lng === null) return;
        const marker = L.marker([lat, lng], { icon: markerIconDefault });
        marker.bindPopup(`<strong>${point.attraction_name}</strong><br/>${point.address || 'N/A'}`);
        feedMarkersLayer.addLayer(marker);
        feedMarkersById.set(point.id, marker);
        marker.addEventListener('click', () => {
          moveFeedCardToItemId(point.id);
        });
        bounds.push([lat, lng]);
      });
      if (bounds.length > 0) {
        feedMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
        feedMapSummaryEl.textContent = `총 ${bounds.length}개 장소가 지도에 표시되었습니다.`;
        lastActiveMarkerId = null;
        updateMarkerIcons();
      } else {
        feedMapSummaryEl.textContent = '지도에 표시할 위치 정보가 없습니다.';
      }
    }

    function syncMapMarkerToCurrentCard() {
      if (!feedMap || !currentFeedItems.length) {
        return;
      }

      const activeItem = currentFeedItems[currentFeedIndex];
      const activeId = parseItemId(activeItem?.id);
      if (activeId === null) {
        return;
      }

      const marker = feedMarkersById.get(activeId);
      if (!marker) {
        return;
      }

      lastActiveMarkerId = activeId;
      updateMarkerIcons();
      feedMap.panTo(marker.getLatLng(), { animate: true });
      marker.openPopup();
    }

    function ensureFeedMap() {
      if (feedMap) return;
      const mapEl = document.getElementById('feedMap');
      feedMap = L.map(mapEl).setView([37.5, 126.98], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(feedMap);
      feedMarkersLayer = L.layerGroup().addTo(feedMap);
    }

    function parseCoordinate(value) {
      const num = parseFloat(value);
      return !isNaN(num) ? num : null;
    }

    function parseItemId(value) {
      const num = parseInt(value, 10);
      return !isNaN(num) ? num : null;
    }

    function openEditModal(item) {
      editingItemId = item.id;
      feedEditAttractionEl.value = item.attraction_name || '';
      feedEditCategoryEl.value = item.category || '';
      feedEditLatitudeEl.value = item.latitude || '';
      feedEditLongitudeEl.value = item.longitude || '';
      feedEditAddressEl.value = item.address || '';
      feedEditImageUrlEl.value = item.image_url || '';
      feedEditDetailEl.value = item.detail || '';
      feedEditModalEl.hidden = false;
    }

    function closeEditModal() {
      feedEditModalEl.hidden = true;
      editingItemId = null;
    }

    function saveEditModal() {
      const parsedId = parseItemId(editingItemId);
      if (parsedId === null) return;

      const idx = currentFeedItems.findIndex(item => parseItemId(item.id) === parsedId);
      const currentItem = idx !== -1 ? currentFeedItems[idx] : null;

      const payload = {
        country: currentItem?.country || feedCountryEl.value,
        city: currentItem?.city || feedCityEl.value,
        attraction: feedEditAttractionEl.value,
        category: feedEditCategoryEl.value,
        latitude: feedEditLatitudeEl.value,
        longitude: feedEditLongitudeEl.value,
        address: feedEditAddressEl.value,
        image_url: feedEditImageUrlEl.value,
        detail: feedEditDetailEl.value,
        maps_url: currentItem?.maps_url || '',
      };

      fetch(`/api/location-info/${parsedId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(async (res) => {
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.error || '저장에 실패했습니다.');
          }
          return data;
        })
        .then(() => {
          if (idx !== -1) {
            currentFeedItems[idx] = {
              ...currentFeedItems[idx],
              attraction_name: payload.attraction,
              category: payload.category,
              latitude: payload.latitude,
              longitude: payload.longitude,
              address: payload.address,
              image_url: payload.image_url,
              detail: payload.detail,
              country: payload.country,
              city: payload.city,
            };
            syncFeedNavState();
            renderFeedMap(currentFeedItems);
            syncMapMarkerToCurrentCard();
          }
          closeEditModal();
        })
        .catch((err) => {
          console.error('Save error:', err);
          alert(err.message || '저장에 실패했습니다.');
        });
    }

    feedCountryEl.addEventListener('change', () => {
      updateCityOptions();
      loadFeedByLocation();
    });
    feedCityEl.addEventListener('change', loadFeedByLocation);
    feedSearchBtnEl.addEventListener('click', loadFeedByLocation);
    feedKeywordEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        loadFeedByLocation();
      }
    });
    feedEditModalBackdropEl.addEventListener('click', closeEditModal);
    feedEditCloseBtnEl.addEventListener('click', closeEditModal);
    feedEditSaveBtnEl.addEventListener('click', saveEditModal);

    function updateCityOptions() {
      const selectedCountry = feedCountryEl.value;
      feedCityEl.innerHTML = '<option value="">도시를 선택하세요</option>';

      const cities = Array.isArray(cityOptions[selectedCountry]) ? cityOptions[selectedCountry] : [];
      cities.forEach((city) => {
        const opt = document.createElement('option');
        opt.value = city;
        opt.textContent = city;
        feedCityEl.appendChild(opt);
      });
    }

    async function loadComboOptions() {
      const prevCountry = feedCountryEl.value;
      const prevCity = feedCityEl.value;

      try {
        const res = await fetch('/api/location-info/options', { cache: 'no-store' });
        if (!res.ok) {
          throw new Error(`옵션 조회 실패: ${res.status}`);
        }

        const payload = await res.json();
        const countries = Array.isArray(payload.countries) ? payload.countries : [];
        cityOptions = payload.cities_by_country || {};

        feedCountryEl.innerHTML = '<option value="">국가를 선택하세요</option>';
        countries.forEach((country) => {
          const opt = document.createElement('option');
          opt.value = country;
          opt.textContent = country;
          feedCountryEl.appendChild(opt);
        });

        if (prevCountry && countries.includes(prevCountry)) {
          feedCountryEl.value = prevCountry;
        }

        updateCityOptions();

        const selectedCities = Array.isArray(cityOptions[feedCountryEl.value]) ? cityOptions[feedCountryEl.value] : [];
        if (prevCity && selectedCities.includes(prevCity)) {
          feedCityEl.value = prevCity;
        }
      } catch (err) {
        console.error('Failed to load combo options:', err);
        // Keep server-rendered country list usable even if options API fails.
        updateCityOptions();
      }
    }

    async function loadFeedByLocation() {
      const country = feedCountryEl.value;
      const city = feedCityEl.value;
      const keyword = (feedKeywordEl.value || '').trim();
      if (!country) {
        currentFeedItems = [];
        currentFeedIndex = 0;
        selectedHeartIds.clear();
        syncFeedNavState();
        return;
      }
      try {
        const queryParts = [`country=${encodeURIComponent(country)}`];
        if (city) {
          queryParts.push(`city=${encodeURIComponent(city)}`);
        }
        if (keyword) {
          queryParts.push(`keyword=${encodeURIComponent(keyword)}`);
        }
        const url = `/api/location-info/list?${queryParts.join('&')}`;
        const res = await fetch(url);
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        currentFeedItems = items.map((item) => ({
          id: item.id,
          country: item.country,
          city: item.city,
          attraction_name: item.attraction,
          category: item.category,
          address: item.address,
          image_url: item.image_url,
          maps_url: item.maps_url,
          detail: item.detail,
          latitude: item.latitude,
          longitude: item.longitude,
        }));
        currentFeedIndex = 0;
        const currentIds = currentFeedItems
          .map((item) => parseItemId(item.id))
          .filter((id) => id !== null);
        await loadHeartSelections(currentIds);
        syncFeedNavState();
        renderFeedMap(currentFeedItems);
        if (currentFeedItems.length) {
          syncMapMarkerToCurrentCard();
        }
      } catch (err) {
        console.error('Failed to load feed:', err);
        currentFeedItems = [];
        currentFeedIndex = 0;
        selectedHeartIds.clear();
        syncFeedNavState();
      }
    }

    loadComboOptions();
  </script>
</body>
</html>
